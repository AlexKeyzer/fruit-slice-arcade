<meta name="theme-color" content="#1a0b30">
<meta name="description" content="Фруктовый Вихрь — сочная аркада на реакцию: режь фрукты свайпом, собирай комбо, избегай бомб. 3 режима и 25 лезвий.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Фруктовый Вихрь / Fruit Slice: Reaction Arcade</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#12082a;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;}
  #game{position:fixed;left:0;top:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}
  #boot{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#fff;background:radial-gradient(circle at 50% 40%,#4b1a63,#1a0b30 70%);z-index:5;
    transition:opacity .35s ease;}
  #boot.hide{opacity:0;pointer-events:none;}
  #boot .t{font-size:min(9vw,44px);font-weight:900;letter-spacing:.5px;
    background:linear-gradient(#fff6c9,#ffd84d 45%,#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #boot .s{margin-top:14px;font-size:min(3.6vw,16px);opacity:.75}
  #boot .bar{margin-top:18px;width:min(52vw,260px);height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:20%;border-radius:3px;background:#8dffbe;transition:width .2s}
  /* модалки согласия/политики (VK-модерация) */
  .fs_modal{position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;display:flex;
    align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
    background:rgba(10,8,20,.82);touch-action:auto;}
  .fs_panel{width:min(94vw,520px);max-height:86vh;overflow-y:auto;box-sizing:border-box;
    background:linear-gradient(180deg,#241c3e,#1a1330);border:2px solid rgba(255,255,255,.16);
    border-radius:18px;padding:22px 20px;color:#fff;box-shadow:0 18px 60px rgba(0,0,0,.55);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .fs_h{font-size:19px;font-weight:900;margin-bottom:10px;color:#ffe066;letter-spacing:.3px}
  .fs_t{font-size:13.5px;line-height:1.55;opacity:.92;white-space:pre-line}
  .fs_url{margin-top:12px;font-size:11.5px;opacity:.65;word-break:break-all}
  .fs_btn{display:block;width:100%;margin-top:14px;padding:13px 10px;border:0;border-radius:12px;
    background:linear-gradient(180deg,#9dffc9,#3ddc84);color:#0c2417;font-size:15.5px;font-weight:900;
    cursor:pointer;font-family:inherit;letter-spacing:.2px}
  .fs_btn:active{transform:scale(.98)}
  .fs_btn.ghost{background:rgba(255,255,255,.1);color:#fff;font-weight:700}

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="boot">
  <div class="t">ФРУКТОВЫЙ ВИХРЬ</div>
  <div class="s">Fruit Slice: Reaction Arcade</div>
  <div class="bar"><i id="bootbar"></i></div>
</div>

<script>
/* =====================================================================
   GAMEPUSH SDK — КЛЮЧИ ПРОЕКТА
   Замените значения на данные из панели GamePush → «Public Zone»:
     • ID проекта  -> GP_PROJECT_ID
     • публичный ключ -> GP_PUBLIC_TOKEN
   Пока стоят плейсхолдеры YOUR_*, SDK НЕ загружается, а игра работает
   на локальном адаптере (без рекламы и облачных сейвов).
   ===================================================================== */
window.GP_PROJECT_ID     = 'YOUR_PROJECT_ID';
window.GP_PUBLIC_TOKEN   = 'YOUR_PUBLIC_TOKEN';
window.GP_SAVE_FIELD     = 'save';
window.GP_SHOW_STICKY    = false;
window.GP_SHOW_PRELOADER = false;
window.GP_STICKY_INSET   = 96;

window.onGPInit = function (gp) {
  window.gp = gp;
  try { window.dispatchEvent(new Event('gp-ready')); } catch (e) {}
};
</script>

   Fruit Slice: Reaction Arcade — physics.js
   Чистая физика: интеграция (полунеявный Эйлер, фикс. шаг), детекция
   разреза (отрезок × окружность), параметры вылета, комбо-множители.
   ===================================================================== */
(function (FS) {
  'use strict';

  function mulberry32(seed) {

    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  P.FIXED_DT = 1 / 120;
  P.MAX_STEPS = 10;
  P.GRAV_K0 = 1.95;
  P.GRAV_K1 = 2.50;
  P.APEX0 = 0.80;
  P.APEX1 = 0.68;
  P.MISS_MARGIN = 1.15;

  P.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  P.lerp = function (a, b, t) { return a + (b - a) * t; };

    return H * P.lerp(P.GRAV_K0, P.GRAV_K1, P.clamp(progress, 0, 1));
  };

  P.integrate = function (b, dt, g) {
    b.vy += g * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += b.spin * dt;
    b.age += dt;
    return b;
  };

    var fx = x1 - cx, fy = y1 - cy;

    else {
      t = -(fx * dx + fy * dy) / len2;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
    }
    var px = x1 + dx * t, py = y1 + dy * t;
    var ex = px - cx, ey = py - cy;
    var d2 = ex * ex + ey * ey;
    if (d2 > r * r) return null;
    var d = Math.sqrt(d2);
    var nx, ny;
    if (d < 1e-6) { nx = 0; ny = -1; } else { nx = ex / d; ny = ey / d; }

  };

    return P.segCircle(x1, y1, x2, y2, cx, cy, r) !== null;

    opt = opt || {};
    var inset = opt.bottomInset || 0;
    var floorY = H - inset;
    var g = P.gravity(H, progress);
    var apexFrac = P.lerp(P.APEX0, P.APEX1, P.clamp(progress, 0, 1));
    if (opt.gentle) apexFrac = 0.62;
    apexFrac *= (0.94 + rnd() * 0.12);
    apexFrac = P.clamp(apexFrac, 0.45, 0.92);

    var apexH = apexFrac * (floorY - r);
    var vy = -Math.sqrt(Math.max(1, 2 * g * apexH));
    var tUp = -vy / g;
    var tTotal = 2 * tUp;

    var pad = Math.max(r * 1.25, W * 0.08);
    var x = (opt.x !== undefined) ? opt.x : pad + rnd() * Math.max(1, W - pad * 2);
    x = P.clamp(x, pad, W - pad);

    var center = W * 0.5;
    var dir = (center >= x) ? 1 : -1;
    var drift = (0.04 + rnd() * 0.26) * W * dir;
    if (opt.gentle) drift *= 0.35;
    var targetX = P.clamp(x + drift, pad, W - pad);
    var vx = (targetX - x) / Math.max(0.35, tTotal);

    var spin = (rnd() * 2 - 1) * (1.8 + rnd() * 3.2);

    return {
      x: x, y: floorY + r * 1.05, vx: vx, vy: vy, rot: rnd() * Math.PI * 2, spin: spin,
      g: g, tUp: tUp, tTotal: tTotal, apexY: floorY + r * 1.05 - apexH, r: r
    };
  };

    var nx = Math.cos(angle + Math.PI / 2), ny = Math.sin(angle + Math.PI / 2);

      { vx: vx - nx * sep, vy: vy - ny * sep - sep * 0.15, spin: -(2.4 + Math.random() * 2.2) }
    ];
  };

    if (n <= 1) return 1;
    if (n === 2) return 2;
    if (n === 3) return 3;
    return 5;
  };

    var base = 38 + 20 * P.clamp(progress, 0, 1);

    return Math.min(60, base);
  };

  P.difficulty = function (t, mode) {
    var span = mode === 'arcade' ? 60 : 150;

  };

    var dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  };

  FS.Physics = P;
  FS.RNG = { mulberry32: mulberry32 };

  /* ============== ЧАСТЬ C: ПРОГРЕСС, СЕЙВЫ, ДОСТИЖЕНИЯ, ЛЕЗВИЯ, КВЕСТЫ == */

  function defaults() {

  function mergeDef(dst, src) {
    if (!src || typeof src !== 'object') return dst;
    for (var k in dst) {
      if (!Object.prototype.hasOwnProperty.call(dst, k)) continue;
      var sv = src[k];
      if (sv === undefined || sv === null) continue;
      if (Array.isArray(dst[k])) {
        if (Array.isArray(sv)) dst[k] = sv.slice();
      } else if (typeof dst[k] === 'object') {
        mergeDef(dst[k], sv);
      } else if (typeof dst[k] === typeof sv) {
        dst[k] = sv;
      }
    }
    return dst;
  }

  var Store = {
    data: defaults(),

  Store.attach = function (platform) {
    Store.platform = platform;
    /* VK-требование: пользовательские данные — только через VK Storage,
       localStorage в VK-среде не используем ( third-party storage в iframe
       может блокироваться браузером и не соответствует правилам платформы). */
    Store.noLocalMirror = !!(platform && platform.name === 'vk');
  };

  Store.load = function () {
    var plat = Store.platform;
    var cloudP = plat && plat.load ? Promise.resolve().then(function () { return plat.load(); })['catch'](function () { return null; }) : Promise.resolve(null);
    return cloudP.then(function (cloud) {
      var local = null;
      if (!Store.noLocalMirror) {
        try { local = JSON.parse(localStorage.getItem(CFG.saveKey) || 'null'); } catch (e) { local = null; }
      }
      var picked = null, src = 'none';
      var cOk = cloud && typeof cloud === 'object';
      var lOk = local && typeof local === 'object';
      if (cOk && lOk) {
        var ct = Number(cloud.ts) || 0, lt = Number(local.ts) || 0;
        var cs = Store.strength(cloud), ls = Store.strength(local);
        if (cs > ls || (cs === ls && ct >= lt)) { picked = cloud; src = 'cloud'; } else { picked = local; src = 'local'; }
      } else if (cOk) { picked = cloud; src = 'cloud'; }
      else if (lOk) { picked = local; src = 'local'; }

      Store.cloudOk = !!(plat && plat.cloud);
      if (!picked) { Store.data = defaults(); Store.source = 'new'; Store.saveNow(); return Store.data; }

      var sv = Number(picked.schema_version) || 0;
      if (sv === 1 || sv === 2) {
        /* мягкий апгрейд v1 -> v2: прогресс сохраняем, добавляем новые поля */
        Store.data = mergeDef(defaults(), picked);
        Store.data.schema_version = CFG.schema;
        Store.migrated = 'v1->v2';
        Store.source = src;
      } else if (sv !== CFG.schema) {
        Store.data = defaults();
        Store.data.coins = CFG.migrationBonus;
        Store.migrated = true;
        Store.source = 'migrated';
      } else {
        Store.data = mergeDef(defaults(), picked);
        Store.source = src;
      }
      if (Store.data.blades_unlocked.indexOf('classic') < 0) Store.data.blades_unlocked.unshift('classic');
      if (Store.data.blades_unlocked.indexOf(Store.data.blade_equipped) < 0) Store.data.blade_equipped = 'classic';
      Store.saveNow();
      return Store.data;
    })['catch'](function () {
      Store.data = defaults();
      Store.source = 'error';
      return Store.data;
    });
  };

    try {
      return (Number(d.coins) || 0) + (Number(d.stats && d.stats.total_fruits) || 0) +
        ((d.achievements && d.achievements.length) || 0) * 50 +

    var raw;

    if (!Store.noLocalMirror) { try { localStorage.setItem(CFG.saveKey, raw); } catch (e) { } }
    if (Store.platform && Store.platform.save && Store.cloudOk) {
      try {
        var pr = Store.platform.save(Store.data);
        if (pr && pr.catch) pr.catch(function () {});
      } catch (e) { }
    }
    return true;
  };

  Store.save = function () {
    Store.data.ts = Date.now();
    var raw;
    try { raw = JSON.stringify(Store.data); } catch (e) { return; }
    if (!Store.noLocalMirror) { try { localStorage.setItem(CFG.saveKey, raw); } catch (e) { } }
    if (Store.saveTimer) return;
    Store.saveTimer = setTimeout(function () {
      Store.saveTimer = null;
      Store.saveCount++;

  var Achievements = {
    list: I18N.ACH,
    newAch: [],
    has: function (id) { return Store.data.achievements.indexOf(id) >= 0; },
    progress: function (a) {
      var d = Store.data, s = d.stats, cur = 0;
      switch (a.type) {
        case 'round_score': cur = Math.max(d.best_scores.classic, d.best_scores.arcade, d.best_scores.zen, s.best_round_score || 0); break;
        case 'total_fruits': cur = s.total_fruits; break;
        case 'max_combo': cur = s.max_combo; break;
        case 'modes_played': cur = (s.modes.classic > 0 ? 1 : 0) + (s.modes.arcade > 0 ? 1 : 0) + (s.modes.zen > 0 ? 1 : 0); break;
        case 'blades_owned': cur = d.blades_unlocked.length; break;
        case 'streak': cur = d.daily.streak; break;
        case 'perfect_round': cur = s.perfect_rounds; break;
        case 'all_gold_round': cur = s.gold_perfect_rounds; break;
        case 'round_fruits': cur = s.best_round_fruits; break;
        case 'zen_score': cur = d.best_scores.zen; break;
        default: cur = 0;
      }
      return Math.min(a.goal, Math.max(0, cur));
    },
    check: function () {
      var unlocked = [];
      for (var i = 0; i < Achievements.list.length; i++) {
        var a = Achievements.list[i];
        if (Achievements.has(a.id)) continue;
        if (Achievements.progress(a) >= a.goal) {
          Store.data.achievements.push(a.id);
          Store.addCoins(a.coins);
          unlocked.push(a);
        }
      }
      if (unlocked.length) {
        Achievements.newAch = unlocked;
        Store.newAch = (Store.newAch || []).concat(unlocked);
        Store.save();
      }
      return unlocked;
    }
  };

  var Daily = {
    today: function () {
      var g = Game && Game.platform && Game.platform.gp;
      var t = g && g.serverTime;
      if (t) { var d = new Date(t); if (!isNaN(d.getTime())) return U.todayKey(d); }
      return U.todayKey(new Date());
    },
    refresh: function () {
      var d = Store.data.daily, today = Daily.today();

      var y = new Date(); y.setUTCDate(y.getUTCDate() - 1);

    },
    canClaim: function () { return Store.data.daily.claimed !== Daily.today(); },
    claim: function () {

  /* -------------------- ЕЖЕДНЕВНЫЕ ЗАДАНИЯ (retention) ------------------ */
  var QUEST_DEFS = [
    { id: 'q_slice',  type: 'slice',  goals: [40, 60, 90],      reward: 60 },
    { id: 'q_combo',  type: 'combos', goals: [4, 6, 9],         reward: 80 },
    { id: 'q_score',  type: 'score',  goals: [600, 1200, 2000], reward: 100 },
    { id: 'q_gold',   type: 'gold',   goals: [2, 3, 5],         reward: 70 },
    { id: 'q_perfect',type: 'perfect',goals: [1, 1, 2],         reward: 90 },
    { id: 'q_arcade', type: 'arcade', goals: [1, 2, 2],         reward: 50 }
  ];

  var Quests = {
    defs: QUEST_DEFS,
    seed: function (str) {
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return FS.RNG.mulberry32(h >>> 0);
    },
    ensureToday: function () {
      var d = Store.data.daily, today = Daily.today();
      if (d.quest_date === today && d.quests && d.quests.length === 3) return d.quests;
      var rnd = Quests.seed('quests-' + today);
      var pool = QUEST_DEFS.slice();
      var picked = [];
      for (var i = 0; i < 3 && pool.length; i++) {
        var idx = Math.floor(rnd() * pool.length);
        var def = pool.splice(idx, 1)[0];
        var g = def.goals[Math.floor(rnd() * def.goals.length)];
        picked.push({ id: def.id, type: def.type, goal: g, cur: 0, claimed: false, reward: def.reward });
      }
      d.quests = picked;
      d.quest_date = today;
      Store.save();
      return picked;
    },
    list: function () { return Quests.ensureToday(); },
    add: function (type, amount) {
      var qs = Quests.ensureToday();
      var changed = false;
      for (var i = 0; i < qs.length; i++) {
        var q = qs[i];
        if (q.type !== type || q.claimed) continue;
        if (type === 'score' || type === 'perfect' || type === 'arcade') {
          /* эти считаются по максимуму за раунд — amount передаётся как значение */
          if (amount > q.cur) { q.cur = Math.min(q.goal, amount); changed = true; }
        } else {
          q.cur = Math.min(q.goal, q.cur + amount);
          changed = true;
        }
        if (q.cur >= q.goal && !q.notified) {
          q.notified = true;
          Game.toast(I18N.t('quest_title') + ': ' + I18N.t(q.id, { n: q.goal }), I18N.t('quest_done'), '#8dffbe');
          Snd.play('quest');
        }
      }
      if (changed) Store.save();
    },
    claim: function (i) {
      var qs = Quests.ensureToday();
      var q = qs[i];
      if (!q || q.claimed || q.cur < q.goal) return 0;
      q.claimed = true;
      Store.addCoins(q.reward);
      Store.flush();
      Snd.play('coin');
      return q.reward;
    },
    doneCount: function () {
      var qs = Quests.ensureToday(), n = 0;
      for (var i = 0; i < qs.length; i++) if (qs[i].claimed || qs[i].cur >= qs[i].goal) n++;
      return n;
    }
  };

  /* ------------------- УРОВНИ ИГРОКА (XP-прогрессия) ------------------- */
  var Levels = {
    need: function (l) { return Math.round(120 * Math.pow(Math.max(1, l), 1.35)); },
    add: function (x) {

  /* -------------------- СЕЗОННЫЕ СОБЫТИЯ (live-ops) -------------------- */
  var EVENTS = [

    list: function () { return Events.ensure().qs; },

  FS.Store = Store;

  /* ================= ЧАСТЬ D: ПУЛЫ, СУЩНОСТИ, ВВОД, ГЕЙМПЛЕЙ ============ */

  function Pool(n, factory) {
    this.a = new Array(n);
    for (var i = 0; i < n; i++) { this.a[i] = factory(); this.a[i].active = false; }
    this.n = n; this.c = 0; this.used = 0; this.recycled = 0;
  }
  Pool.prototype.get = function () {
    for (var i = 0; i < this.n; i++) {
      var k = (this.c + i) % this.n, o = this.a[k];
      if (!o.active) { this.c = (k + 1) % this.n; o.active = true; this.used++; return o; }

    /* отправка результата в лидерборд площадки */
    if (Game.platform && Game.platform.lbSubmit) {
      try {
        Game.platform.lbSubmit(Game.score).then(function (res) {
          if (res && res.rank) {
            Game.lbRank = res.rank;
            if (Game.go) { Game.go.rank = res.rank; }
            if (Game.screen === 'gameover') Game.layoutScreen();
          }
        })['catch'](function () {});
      } catch (e) { }
    }
    Game.recOn = false;
    Game.goAnim = 0;
    Game.screen = 'gameover';
    Game.layoutScreen();
    Game.fade = 1; Game.fadeDir = -1;
    if (isRecord) Game.confetti(Game.W / 2, Game.H * 0.25, 40, ['#ffd84d', '#ff5a6e', '#8dffbe', '#7fd8ff', '#ff9d2e']);
    if (Game.platform && Game.platform.gameplayStop) {
      try { var p2 = Game.platform.gameplayStop(); if (p2 && p2.catch) p2.catch(function () {}); } catch (e) {}
    }
    if (Game.score > 0) Snd.play(isRecord ? 'win' : 'lose');
    Snd.intensity = 0;
    Game.logMsg('round-end:' + reason + ':' + Game.score);
    return Game.go;
  };

  Game.applyDouble = function () {
    if (!Game.go || Game.go.doubled) return false;
    var add = Game.go.score;
    Game.go.score = Game.go.score * 2;
    Game.score = Game.go.score;
    Game.go.doubled = true; Game.doubled = true;
    var mode = Game.go.mode;
    if (Game.go.score > Store.data.best_scores[mode]) {
      Store.data.best_scores[mode] = Game.go.score;
      Game.go.isRecord = true; Game.go.best = Game.go.score;
    }
    var extra = Math.floor(add / 100) * CFG.coinPer100;
    Store.addCoins(extra);
    Game.go.coins += extra;
    Store.data.stats.total_score += add;
    if (Game.go.score > Store.data.stats.best_round_score) Store.data.stats.best_round_score = Game.go.score;
    Quests.add('score', Game.go.score);
    Achievements.check();
    Store.flush();
    Snd.play('buy');
    Game.toast(I18N.t('doubled'), '+' + add, '#ffd84d');
    return true;
  };

  Game.doContinue = function () {
    if (!Game.go || !Game.go.canContinue) return false;
    Game.go.canContinue = false;
    Game.continuesUsed++;
    Game.lives = CFG.classicLives;
    Game.screen = 'playing';
    Game.running = true;
    Game.paused = false;
    Game.fruits.clear(); Game.halves.clear(); Game.parts.clear(); Game.popups.clear();
    Game.acc = 0;
    if (Game.round) { Game.round.nextSpawn = 0.4; Game.round.spawnAcc = 1; Game.round.continued = true; Game.round.misses = 0; }
    Game.layoutScreen();
    Game.fade = 1; Game.fadeDir = -1;
    if (Game.platform && Game.platform.gameplayStart) {
      try { var p = Game.platform.gameplayStart(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    Snd.play('start');
    Game.logMsg('continue');
    return true;
  };

  /* --------------------------- РЕКЛАМА [ADS MAP] ---------------------- */
  Game.adsAvailable = function (kind) {
    if (!Game.consentOK) return false;   /* до принятия условий реклама не показывается (требование VK) */
    var pl = Game.platform;
    if (!pl) return false;
    try {
      if (kind === 'rewarded') return pl.isRewardedAvailable ? !!pl.isRewardedAvailable() : true;
      return pl.isFullscreenAvailable ? !!pl.isFullscreenAvailable() : true;
    } catch (e) { return false; }
  };

  Game.canInterstitial = function () {
    var g = Game.adGate;
    if (!Game.adsAvailable('fullscreen')) return false;
    if (Game.sessionTime - g.sessionStart < CFG.interstitialGrace) return false;
    if (Game.sessionTime - g.lastInterstitial < CFG.interstitialCooldown) return false;
    if (g.shown >= CFG.maxInterstitialPerSession) return false;
    return true;
  };

  Game.showInterstitial = function (reason, cb) {
    if (!Game.canInterstitial()) { if (cb) cb(false); return false; }
    var t0 = U.now();
    Game.setPaused(true, 'ad');
    Game.adGate.pending = reason;
    var done = false;
    function finish(ok) {
      if (done) return; done = true;
      Game.perf.adDelay = (U.now() - t0) / 1000;
      Game.adGate.lastInterstitial = Game.sessionTime;
      if (ok) Game.adGate.shown++;
      Game.setPaused(false, 'ad');
      Game.logMsg('interstitial:' + reason + ':' + (ok ? 'ok' : 'fail') + ':' + Game.perf.adDelay.toFixed(2) + 's');
      if (cb) cb(ok);
    }
    try {
      Game.platform.interstitial(function () { finish(true); }, function () { finish(false); });
    } catch (e) { finish(false); }
    setTimeout(function () { finish(false); }, 12000);
    return true;
  };

  Game.showRewarded = function (reward, cb, reason) {
    if (!Game.adsAvailable('rewarded')) {
      Game.toast(I18N.t('no_ads'), '', '#ff8fa3');
      if (cb) cb(false);
      return false;
    }
    Game.setPaused(true, 'ad');
    var got = false, done = false;
    function finish(ok) {
      if (done) return; done = true;
      Game.setPaused(false, 'ad');
      Game.logMsg('rewarded:' + (reason || '') + ':' + (ok ? 'ok' : 'fail'));
      if (cb) cb(ok);
    }
    try {
      Game.platform.rewarded(function () {
        got = true;
        try { if (reward) reward(); } catch (e) { }
      }, function (ok) { finish(got || ok !== false); }, function () { finish(false); });
    } catch (e) { finish(false); }
    setTimeout(function () { finish(got); }, 20000);
    return true;
  };

  /* ------------------------------ ТУТОРИАЛ [12] ----------------------- */
  Game.startTutorial = function () {
    Game.screen = 'tutorial';
    Game.tutStep = 1;
    Game.tutSpawnT = 0.4;
    Game.fruits.clear(); Game.halves.clear(); Game.parts.clear(); Game.popups.clear(); Game.fx.clear();
    Game.tutBase = { slices: Game.counters.slices, combos: Game.counters.combos };
    Game.mode = 'classic';

    Game.logMsg('tutorial-start');
  };

  Game.tutNext = function () {
    Game.tutStep++;
    Game.tutSpawnT = 0.35;
    Game.fruits.clear();
    Game.tutBase = { slices: Game.counters.slices, combos: Game.counters.combos };
    Snd.play('ui');
    if (Game.tutStep > 3) Game.tutFinish();
    Game.layoutScreen();
  };

  Game.tutFinish = function () {
    Store.data.tutorial_done = true;
    Store.flush();
    Game.tutStep = 0;
    Game.screen = 'menu';
    Game.layoutScreen();
    Game.fade = 1; Game.fadeDir = -1;
    Game.toast(I18N.t('tut_done'), '', '#b9ffcf');
    Game.logMsg('tutorial-done');
  };

  Game.tutSkip = function () {
    Store.data.tutorial_done = true;
    Store.flush();
    Game.tutStep = 0;
    Game.screen = 'menu';
    Game.layoutScreen();
    Game.fade = 1; Game.fadeDir = -1;
    Snd.play('back');
    Game.logMsg('tutorial-skip');
  };

  Game.updateTutorial = function (dt) {
    if (Game.tutStep === 1) {
      Game.tutSpawnT -= dt;
      var anyFruit = false;
      for (var i = 0; i < Game.fruits.n; i++) if (Game.fruits.a[i].active) { anyFruit = true; break; }
      if (!anyFruit && Game.tutSpawnT <= 0) {
        Game.spawn(Fruits.byId.watermelon, { x: Game.W * (0.35 + Game.rng() * 0.3), gentle: true, noMiss: true });
        Game.tutSpawnT = 1.5;
      }
      if (Game.counters.slices > Game.tutBase.slices) Game.tutNext();
    } else if (Game.tutStep === 3) {
      Game.tutSpawnT -= dt;
      var cnt = 0;
      for (var j = 0; j < Game.fruits.n; j++) if (Game.fruits.a[j].active) cnt++;
      if (cnt === 0 && Game.tutSpawnT <= 0) {
        var c = Game.W * 0.5, dx = Game.unit * 0.16;
        Game.spawn(Fruits.byId.orange, { x: c - dx, gentle: true, noMiss: true });
        Game.spawn(Fruits.byId.apple, { x: c + dx, gentle: true, noMiss: true });
        Game.tutSpawnT = 1.6;
      }
      if (Game.counters.combos > Game.tutBase.combos) Game.tutNext();
    }
  };

  /* --------------------------- ФИЗИКА/СУЩНОСТИ ------------------------ */
  Game.physicsStep = function (dt) {
    var g = Game.roundG || P.gravity(Game.H, Game.round ? Game.round.progress : 0);
    var i, o;
    var pool = Game.fruits.a;
    for (i = 0; i < pool.length; i++) {
      o = pool[i];
      if (!o.active) continue;
      P.integrate(o, dt, g);
      if (o.sq > 0) o.sq = Math.max(0, o.sq - dt * 3.2);
      if (!o.wasUp && o.y < Game.missLine - o.r * 0.5) o.wasUp = true;
      if (!o.sliced && o.wasUp && o.vy > 0 && (o.y - o.r * 0.35) > (Game.missLine + o.r * 0.9)) {
        o.missed = true;
        Game.fruits.release(o);
        if (!o.noMiss && o.kind !== 'bomb') {
          if (Game.mode === 'classic' && Game.screen === 'playing') Game.loseLife('miss');
          else if (Game.screen === 'playing') Game.round && Game.round.misses++;
        }
        continue;
      }
      if (o.x < -o.r * 3.5 || o.x > Game.W + o.r * 3.5 || o.y > Game.H + o.r * 6) {
        Game.fruits.release(o);
      }
    }
    pool = Game.halves.a;
    for (i = 0; i < pool.length; i++) {
      o = pool[i];
      if (!o.active) continue;
      P.integrate(o, dt, g);
      if (o.age > o.life * 0.75) o.fade = Math.max(0, 1 - (o.age - o.life * 0.75) / (o.life * 0.25));
      /* половинки капают соком */
      o.drip -= dt;
      if (o.drip <= 0 && o.age < o.life * 0.6 && Game.parts.used < CFG.maxParts - 4) {
        o.drip = (Game.qLow ? 0.30 : 0.16) + Game.rng() * 0.16;
        Game.particle('juice', o.x, o.y, (Game.rng() - 0.5) * 30, 40 + Game.rng() * 60,
          o.type.juice, 0.5 + Game.rng() * 0.3, o.r * 0.10, 1.2, Assets.get(o.type.splash));
      }
      if (o.age >= o.life || o.y - o.r > Game.H + o.r * 2) {
        Game.halfCache.release(o.cache); o.cache = null;
        Game.halves.release(o);
      }
    }
    pool = Game.parts.a;
    for (i = 0; i < pool.length; i++) {
      o = pool[i];
      if (!o.active) continue;
      o.vy += g * 0.55 * o.grav * dt;
      o.vx *= (1 - 0.9 * dt);
      o.x += o.vx * dt; o.y += o.vy * dt;
      o.rot += o.spin * dt;
      o.age += dt;
      o.alpha = Math.max(0, 1 - o.age / o.life);
      if (o.age >= o.life || o.y - o.r > Game.H + 20) Game.parts.release(o);
    }
    pool = Game.splats.a;
    for (i = 0; i < pool.length; i++) {
      o = pool[i];
      if (!o.active) continue;
      o.age += dt;
      if (o.age >= o.life) Game.splats.release(o);
    }
    pool = Game.fx.a;
    for (i = 0; i < pool.length; i++) {
      o = pool[i];
      if (!o.active) continue;
      o.age += dt;
      if (o.kind === 'ring') o.r += o.vr * dt;
      else {
        o.vy += o.grav * dt;
        o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.spin * dt;
      }
      if (o.age >= o.life || o.y > Game.H + 40) Game.fx.release(o);
    }
  };

  Game.updatePopups = function (dt) {
    var pool = Game.popups.a;
    for (var i = 0; i < pool.length; i++) {
      var o = pool[i];
      if (!o.active) continue;
      o.age += dt;
      o.y += o.vy * dt;
      o.vy *= (1 - 1.6 * dt);
      o.scale = o.age < 0.18 ? U.easeBack(o.age / 0.18) : 1;
      if (o.age >= o.life) Game.popups.release(o);
    }
    for (var j = Game.toasts.length - 1; j >= 0; j--) {
      Game.toasts[j].age += dt;
      if (Game.toasts[j].age >= Game.toasts[j].life) Game.toasts.splice(j, 1);
    }
  };

  Game.step = function (dt) {
    Game.sessionTime += dt;
    Game.adGate.playTime += (Game.screen === 'playing' ? dt : 0);
    Game.menuT += dt;

    /* game-feel: затухание эффектов */
    if (Game.pulse > 0) Game.pulse = Math.max(0, Game.pulse - dt * 3.2);
    if (Game.juiceV > 0) Game.juiceV = Math.max(0, Game.juiceV - dt * 1.1);
    if (Game.scorePop > 0) Game.scorePop = Math.max(0, Game.scorePop - dt * 4);
    if (Game.fadeDir === -1) { Game.fade = Math.max(0, Game.fade - dt * 3.4); if (Game.fade === 0) Game.fadeDir = 0; }
    else if (Game.fadeDir === 1) {
      Game.fade = Math.min(1, Game.fade + dt * 5);
      if (Game.fade >= 1 && Game.pendingScreen) {
        Game.screen = Game.pendingScreen; Game.pendingScreen = null;
        Game.layoutScreen();
        Game.fadeDir = -1;
      }
    }

    /* hit-stop: микро-замедление на ударах */
    var physDt = dt;
    if (Game.hitstop > 0) {
      Game.hitstop = Math.max(0, Game.hitstop - dt);
      physDt = dt * 0.18;
    }

    if (Game.screen === 'playing') {
      var r = Game.round;
      r.t += dt;
      r.progress = P.difficulty(r.t, Game.mode);
      Game.roundG = Game.freezeGravity ? 1e-6 : P.gravity(Game.H, r.progress);

      if (Game.freezeT > 0) Game.freezeT = Math.max(0, Game.freezeT - dt);
      if (Game.doubleT > 0) Game.doubleT = Math.max(0, Game.doubleT - dt);
      if (Game.slowmoT > 0) Game.slowmoT = Math.max(0, Game.slowmoT - dt);
      if (Game.feverT > 0) {
        Game.feverT = Math.max(0, Game.feverT - dt);
        Game.fever = Game.feverT / CFG.feverTime * CFG.feverMax;
        if (Game.feverT === 0) Game.endFever();
      }
      Game.timeScale = Game.freezeT > 0 ? CFG.freezeScale : (Game.slowmoT > 0 ? CFG.slowmoScale : 1);

      if (Game.mode !== 'classic') {
        var before = Math.ceil(Game.timeLeft);
        Game.timeLeft = Math.max(0, Game.timeLeft - dt);
        var after = Math.ceil(Game.timeLeft);
        if (after !== before && after <= 5 && after > 0) Snd.play('tick');
        if (Game.timeLeft <= 0) { Game.endRound('time'); return; }
      }

      Game.updateSpawner(dt);

      Game.acc += physDt * Game.timeScale;
      var steps = 0;
      while (Game.acc >= P.FIXED_DT && steps < P.MAX_STEPS) {
        Game.physicsStep(P.FIXED_DT);
        Game.acc -= P.FIXED_DT;
        steps++;
      }
      if (steps >= P.MAX_STEPS) Game.acc = 0;
      Game.updatePopups(dt * (Game.timeScale < 1 ? 0.6 : 1));
    } else if (Game.screen === 'tutorial') {
      Game.roundG = Game.freezeGravity ? 1e-6 : P.gravity(Game.H, 0);
      Game.acc += physDt;
      var st = 0;
      while (Game.acc >= P.FIXED_DT && st < P.MAX_STEPS) { Game.physicsStep(P.FIXED_DT); Game.acc -= P.FIXED_DT; st++; }
      if (st >= P.MAX_STEPS) Game.acc = 0;
      Game.updatePopups(dt);
      Game.updateTutorial(dt);
    } else if (Game.screen === 'replay') {
      var rr2 = Game.round;
      rr2.t += dt;
      rr2.progress = P.difficulty(rr2.t, Game.mode);
      Game.roundG = P.gravity(Game.H, rr2.progress);
      Game.timeScale = 1;
      Game.updateSpawner(dt);
      Game.acc += dt;
      var rs = 0;
      while (Game.acc >= P.FIXED_DT && rs < P.MAX_STEPS) { Game.physicsStep(P.FIXED_DT); Game.acc -= P.FIXED_DT; rs++; }
      if (rs >= P.MAX_STEPS) Game.acc = 0;
      Game.feedReplay();
      Game.updatePopups(dt);
      if (Game.mode !== 'classic' && Game.timeLeft > 0) Game.timeLeft = Math.max(0, Game.timeLeft - dt);
      if ((Game.round.t > (Game.replayEnd || 30)) || (Game.mode !== 'classic' && Game.timeLeft <= 0)) {
        Game.stopReplay();
      }
    } else if (Game.screen === 'gameover') {
      Game.goAnim = Math.min(1, (Game.goAnim || 0) + dt * 1.4);
      Game.acc += physDt * 0.5;
      var gs = 0;
      while (Game.acc >= P.FIXED_DT && gs < P.MAX_STEPS) { Game.physicsStep(P.FIXED_DT); Game.acc -= P.FIXED_DT; gs++; }
      Game.updatePopups(dt);
    } else {
      Game.updatePopups(dt);
      Game.updateMenuFruits(dt);
      Game.timeScale = 1;
    }

    if (Game.shake > 0) Game.shake = Math.max(0, Game.shake - dt * Game.unit * 0.09);
    if (Game.flash > 0) Game.flash = Math.max(0, Game.flash - dt * 2.6);
    if (Game.vignette > 0) Game.vignette = Math.max(0, Game.vignette - dt);
    if (Input.stroke.active && Input.down === false) {
      Game.finishStroke();
    } else if (Input.stroke.active && (Game.nowMs - Input.lastMoveT) > CFG.strokeGap * 1000) {
      Game.finishStroke();
    }
  };

  /* ------------------------- REPLAY РЕКОРДА --------------------------- */
  Game.replayIdx = 0;
  Game.replayEnd = 30;
  Game.startReplay = function () {
    var rp = Store.data.replay;
    if (!rp || !rp.pts || rp.pts.length < 6) return false;
    Game.replayData = rp;
    Game.replayIdx = 0;
    Game.replayEnd = (rp.pts[rp.pts.length - 3] || 30000) / 1000 + 1.5;
    Game.mode = rp.mode === 'duel' ? 'arcade' : rp.mode;
    Game.screen = 'replay';
    Game.running = false;
    Game.paused = false;
    Game.score = 0; Game.lives = CFG.classicLives;
    Game.timeLeft = Game.mode === 'classic' ? 0 : (Game.mode === 'arcade' ? CFG.arcadeTime : CFG.zenTime);
    Game.fever = 0; Game.feverT = 0; Game.freezeT = 0; Game.doubleT = 0; Game.slowmoT = 0;
    Game.fruits.clear(); Game.halves.clear(); Game.parts.clear(); Game.popups.clear(); Game.splats.clear(); Game.fx.clear();
    Game.roundSeed = rp.seed >>> 0;
    Game.roundRng = FS.RNG.mulberry32(Game.roundSeed ^ 0x9e3779b9);
    Game.round = {
      mode: Game.mode, t: 0, progress: 0, score: 0, fruits: 0, combos: 0, maxCombo: 0,
      misses: 0, bombs: 0, spawned: 0, goldSpawned: 0, goldSliced: 0, coins: 0, perfects: 0,
      spawnAcc: 1, nextSpawn: CFG.firstSpawnDelay, gentleUntil: CFG.gentleTime, continued: false,
      goldSpawnedStart: Game.counters.goldSpawned, slicesStart: Game.counters.slices, startedAt: Date.now()
    };
    Game.recOn = false;
    Input.reset();
    Input.down = true; Input.has = true; Input.pendHas = false;
    Game.layoutScreen();
    Game.fade = 1; Game.fadeDir = -1;
    Game.logMsg('replay-start:' + Game.roundSeed);
    return true;
  };

  Game.feedReplay = function () {
    var rp = Game.replayData;
    if (!rp) return;
    var tMs = Game.round.t * 1000;
    var pts = rp.pts;
    while (Game.replayIdx < pts.length / 3 && pts[Game.replayIdx * 3] <= tMs) {
      var x = pts[Game.replayIdx * 3 + 1], y = pts[Game.replayIdx * 3 + 2];
      var pt = pts[Game.replayIdx * 3];
      if (Game._lastRpT !== undefined && pt - Game._lastRpT > CFG.strokeGap * 1000) {
        Game.finishStroke();
        Input.pendHas = false;
      }
      Game._lastRpT = pt;
      Input.handlePoint(x, y, pt);
      Game.replayIdx++;
    }
  };

  Game.stopReplay = function () {
    Game.replayData = null;
    Game._lastRpT = undefined;
    Input.reset();
    Game.screen = 'menu';
    Game.layoutScreen();
    Game.fade = 1; Game.fadeDir = -1;
    Game.toast(I18N.t('replay_title'), String(Store.data.replay ? Store.data.replay.score : 0), '#8dffbe');
  };

  /* ------------------------------ СПАВНЕР [24] ------------------------ */
  Game.updateSpawner = function (dt) {
    var r = Game.round;
    if (!r) return;

    var prog = r.progress;
    var perMin = P.spawnPerMinute(prog, Game.mode);
    r.spawnAcc += (perMin / 60) * dt;
    if (r.spawnAcc > 2.5) r.spawnAcc = 2.5;
    r.lastPerMin = perMin;

    r.nextSpawn -= dt;
    if (r.nextSpawn > 0) return;

    var want = 1;
    var rnd = Game.roundRng || Game.rng;
    if (prog > 0.12 && rnd() < 0.26) want = 2;
    if (prog > 0.50 && rnd() < 0.16) want = 3;
    if (Game.mode === 'zen' && prog > 0.2 && rnd() < 0.20) want = 2;

    if (r.spawnAcc >= want && Game.fruits.used < CFG.maxFruits - 4) {
      r.spawnAcc -= want;
      var gentle = (r.t < r.gentleUntil);
      for (var i = 0; i < want; i++) {
        var type;
        if (Game.feverT > 0 && rnd() < 0.30) type = Fruits.specials.gold;
        else if (gentle && i === 0 && r.spawned < 3) type = Fruits.byId[rnd() < 0.5 ? 'watermelon' : 'orange'];
        else type = Fruits.pickSpawn(Game.mode, prog, rnd);
        var ev = Events.current();
        if (ev && type.kind === 'fruit' && rnd() < ev.bias) type = Fruits.byId[ev.fruits[(rnd() * ev.fruits.length) | 0]] || type;
        if (Game.mode === 'zen' && type.kind === 'bomb') type = Fruits.byId.apple;
        var opt = { gentle: gentle && r.spawned < 3 };
        if (want > 1) opt.x = U.clamp(Game.W * (0.22 + 0.56 * (i / Math.max(1, want - 1))) + (Game.rng() - 0.5) * Game.W * 0.08, Game.W * 0.1, Game.W * 0.9);
        Game.spawn(type, opt);
      }
    }
    if ((Game.mode === 'arcade' || Game.mode === 'daily') && r.t >= (r.bossAt || 20)) {
      r.bossAt = (r.bossAt || 20) + 20;
      if (!r.bossAlive) {
        var bss = Game.spawn(Fruits.specials.boss, { gentle: false });
        if (bss) { r.bossAlive = true; Game.toast(I18N.t('boss_in'), I18N.t('boss_hint'), '#ff9d2e'); Snd.play('freeze'); }
      }
    }
    if (r.bossAlive) {
      var anyBoss = false;

  UI.find = function (x, y) {
    var bs = Game.buttons;
    for (var i = bs.length - 1; i >= 0; i--) {
      var b = bs[i];
      if (!b.enabled || b.hidden) continue;
      var by = b.list ? b.y - Game.scroll : b.y;
      if (b.list) {
        var la = UI.listArea;
        if (la && (y < la.y || y > la.y + la.h)) continue;
      }
      if (x >= b.x && x <= b.x + b.w && y >= by && y <= by + b.h) return b;
    }
    return null;
  };

  UI.pointerDown = function (x, y) {
    UI.dragMoved = 0;
    var la = UI.listArea;
    var b = UI.find(x, y);
    if (b) { UI.pressed = b; UI.dragId = b.id; b.press = 1; return true; }
    if (la && x >= la.x && x <= la.x + la.w && y >= la.y && y <= la.y + la.h && Game.scrollMax > 0) {
      Game.dragging = true; Game.dragStart = y; Game.dragScroll0 = Game.scroll;
      return true;
    }
    return false;
  };

  UI.dragMove = function (x, y) {
    UI.dragMoved += Math.abs(y - (UI.lastY === undefined ? y : UI.lastY));
    UI.lastY = y;
    if (Game.dragging && Game.scrollMax > 0) {
      Game.scroll = U.clamp(Game.dragScroll0 - (y - Game.dragStart), 0, Game.scrollMax);
      Game.scrollTarget = Game.scroll;
    }
  };

  UI.dragEnd = function () {
    Game.dragging = false;
    UI.lastY = undefined;
    if (UI.pressed) UI.pressed.press = 0;
  };

  UI.pointerUp = function (x, y) {

    Game.buttons.push(B('duel_create', pad, y, bw, bh, I18N.t('duel_create'), function () { Game.duelCreate(); }, 'primary'));
    y += bh + pad * 0.6;
    /* код-дисплей */
    Game.buttons.push(B('duel_disp', pad, y, bw, bh * 0.8, Game.duelBuf || '—', null, 'row', { list: true, enabled: false }));
    y += bh * 0.8 + pad * 0.6;
    /* клавиатура */
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ':', '0', '<'];
    var kw = (bw - pad * 0.6 * 2) / 3, kh = u * 0.095;
    for (var i = 0; i < 12; i++) {
      var kx = pad + (i % 3) * (kw + pad * 0.6);
      var ky = y + Math.floor(i / 3) * (kh + pad * 0.5);
      Game.buttons.push(B('kb_' + keys[i], kx, ky, kw, kh, keys[i] === '<' ? '⌫' : keys[i],
        (function (kk) { return function () { Game.duelKey(kk); }; })(keys[i]), 'ghost', { list: true }));
    }
    y = y + 4 * (kh + pad * 0.5) + pad * 0.4;
    Game.buttons.push(B('duel_go', pad, y, bw, bh, I18N.t('duel_enter'), function () { Game.duelStart(); }, 'gold', { list: true }));
    Game.contentH = y + bh + pad;
    Game.scrollMax = Math.max(0, Game.contentH - (la.y + la.h));

    for (var i = 0; i < rows.length; i++) {
      Game.buttons.push(B('set_' + rows[i][0], x, y, w, rh, rows[i][1], rows[i][3],

      y += rh + pad * 0.55;

  /** Карточка результата 1024×1024 для шеринга картинкой */
  Game.makeCard = function () {
    var S = 1024;
    var cv = document.createElement('canvas');
    cv.width = cv.height = S;
    var c = cv.getContext('2d');
    var g = c.createLinearGradient(0, 0, S * 0.4, S);
    g.addColorStop(0, '#3d1163'); g.addColorStop(0.5, '#5c1a6e'); g.addColorStop(1, '#160a2c');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    var rnd = FS.RNG.mulberry32(77);
    c.save(); c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 6; i++) {
      var nx = rnd() * S, ny = rnd() * S, nr = S * (0.2 + rnd() * 0.2);
      var col = ['#ff6fa5', '#ffd84d', '#6fd0ff'][i % 3];
      var ng = c.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, U.rgba(col, 0.16)); ng.addColorStop(1, U.rgba(col, 0));
      c.fillStyle = ng; U.circle(c, nx, ny, nr); c.fill();
    }
    c.restore();
    /* фрукты-герои */
    var trio = ['fruit_watermelon.png', 'fruit_orange.png', 'fruit_strawberry.png'];
    for (var k = 0; k < 3; k++) {
      var im = Assets.get(trio[k]);
      if (!im) continue;
      var fr = S * (k === 0 ? 0.16 : 0.11);
      var fx = S * (0.24 + k * 0.26), fy = S * 0.30 + (k === 1 ? -S * 0.05 : S * 0.02);
      c.save();
      c.translate(fx, fy); c.rotate((k - 1) * 0.35);
      c.drawImage(im, -fr, -fr, fr * 2, fr * 2);
      c.restore();
    }
    /* заголовок и счёт */
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '900 ' + (S * 0.075) + 'px ' + U.FONT;
    c.lineJoin = 'round'; c.lineWidth = S * 0.014; c.strokeStyle = 'rgba(30,6,50,.85)';
    var title = I18N.t('app_title').toUpperCase();
    c.strokeText(title, S / 2, S * 0.52); 
    var tg = c.createLinearGradient(0, S * 0.48, 0, S * 0.56);
    tg.addColorStop(0, '#fff6c9'); tg.addColorStop(1, '#ff9d2e');
    c.fillStyle = tg; c.fillText(title, S / 2, S * 0.52);
    var go = Game.go;
    var score = go ? go.score : (Store.data.stats.best_round_score || 0);
    c.font = '900 ' + (S * 0.19) + 'px ' + U.FONT;
    c.lineWidth = S * 0.02; c.strokeStyle = 'rgba(30,6,50,.85)';
    c.strokeText(String(score), S / 2, S * 0.66);
    c.fillStyle = '#ffffff'; c.fillText(String(score), S / 2, S * 0.66);
    c.font = '800 ' + (S * 0.045) + 'px ' + U.FONT;
    c.fillStyle = 'rgba(255,255,255,.85)';
    var st = Store.data.stats;
    c.fillText(I18N.t('go_max_combo') + ': ' + (st.max_combo || 0) + '   •   ' + I18N.t('lvl', { n: st.level || 1 }), S / 2, S * 0.75);
    if (Game.lbRank) c.fillText(I18N.t('rating_place', { n: Game.lbRank }), S / 2, S * 0.80);
    /* росчерк лезвия */
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.lineCap = 'round';
    var bl = Blades.current();
    for (var ps = 0; ps < 3; ps++) {
      c.beginPath();
      c.moveTo(S * 0.12, S * 0.90);
      c.quadraticCurveTo(S * 0.5, S * 0.80, S * 0.88, S * 0.88);
      c.lineWidth = (ps === 0 ? S * 0.035 : ps === 1 ? S * 0.016 : S * 0.006);
      c.strokeStyle = ps === 0 ? U.rgba(bl.c1, 0.4) : (ps === 1 ? U.rgba(bl.c2, 0.8) : 'rgba(255,255,255,.95)');
      c.stroke();
    }
    c.restore();
    return cv;
  };

  /** Шеринг: картинка-карточка → gp.socials → navigator.share → буфер обмена */
  Game.share = function () {
    var go = Game.go;
    var score = go ? go.score : (Store.data.stats.best_round_score || 0);
    var combo = Store.data.stats.max_combo || 0;
    var text = I18N.t('share_text', { score: score, combo: combo });
    var gp = Game.platform && Game.platform.gp;
    var soc = gp && gp.socials;
    if (typeof navigator !== 'undefined' && navigator.share && navigator.canShare) {
      try {
        var card = Game.makeCard();
        if (card && card.toBlob) {
          card.toBlob(function (blob) {
            var ok = false;
            if (blob) {
              try {
                var file = new File([blob], 'fruit-slice.png', { type: 'image/png' });
                var data = { files: [file], title: I18N.t('app_title'), text: text };
                if (navigator.canShare(data)) {
                  ok = true;
                  Game.logMsg('share:card');
                  navigator.share(data)['catch'](function () { Game.shareTextOnly(text, soc); });
                }
              } catch (e) { }
            }
            if (!ok) Game.shareTextOnly(text, soc);
          }, 'image/png');
          Snd.play('ui');
          return 'card';
        }
      } catch (e) { }
    }
    return Game.shareTextOnly(text, soc);
  };

  Game.shareWithText = function (text) {
    var pl = Game.platform;
    if (pl && pl.shareLink) {
      var link = (typeof location !== 'undefined' ? location.href : '');
      pl.shareLink(link).then(function (ok) {
        if (!ok) { var gp = pl.gp; Game.shareTextOnly(text, gp && gp.socials); }
        else { Snd.play('ui'); Game.logMsg('share:vk'); }
      });
      return 'vk';
    }
    var gp2 = pl && pl.gp;

  Game.updateMenuFruits = function (dt) {
    if (!Game.menuFruits) Game.initMenuFruits();

      var f = Game.menuFruits[i];

      if (f.x < -r * 2) f.x = Game.W + r;
      if (f.x > Game.W + r * 2) f.x = -r;

  Game.bgFor = function () {

    if (s === 'menu' || s === 'modes' || s === 'confirm' || s === 'duel') return 'bg_menu.png';

  Game.modeTint = function () {
    if (Game.screen === 'playing' || Game.screen === 'paused' || Game.screen === 'gameover') {

  Game.drawBackground = function () {
    var ctx = Game.ctx, W = Game.W, H = Game.H;
    var img = Assets.get(Game.bgFor());
    if (img) {
      ctx.save();
      ctx.translate(-Game.parX * 6 - 12, -Game.parY * 6 - 12);
      U.cover(ctx, img, W + 24, H + 24);
      ctx.restore();
    } else {
      var g = Game._bgGrad;
      if (!g || Game._bgKey !== W + 'x' + H + Game.bgFor()) {
        g = ctx.createLinearGradient(0, 0, 0, H);
        var s = Game.bgFor();
        if (s === 'bg_menu.png') { g.addColorStop(0, '#2a1152'); g.addColorStop(0.55, '#4b1a63'); g.addColorStop(1, '#1a0b30'); }
        else if (s === 'bg_shop.png') { g.addColorStop(0, '#101a3a'); g.addColorStop(1, '#2a1152'); }
        else { g.addColorStop(0, '#171233'); g.addColorStop(0.6, '#241a4a'); g.addColorStop(1, '#0e0a20'); }
        Game._bgGrad = g; Game._bgKey = W + 'x' + H + s;
      }
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = Game.modeTint();
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5;
    var shX = Math.sin(Game.sessionTime * 0.10) * W * 0.04 - Game.parX * 10;
    ctx.drawImage(Game.shaftsTex(), shX - W * 0.05, -H * 0.06, W * 1.1, H * 0.72);
    /* амбиент-мотты: живая пыль в свете */
    var worldish = (Game.screen === 'playing' || Game.screen === 'paused' || Game.screen === 'tutorial' || Game.screen === 'gameover' || Game.screen === 'replay');
    if (worldish) {
      for (var mI = 0; mI < 8; mI++) {
        var seedI = mI * 12.9898;
        var mx = (Math.sin(seedI) * 0.5 + 0.5) * W + Math.sin(Game.sessionTime * 0.35 + mI) * W * 0.04;
        var my = ((Game.sessionTime * (0.02 + (mI % 5) * 0.008) + (mI * 0.137)) % 1.2 - 0.1) * H;
        var mr = Game.unit * (0.006 + (mI % 4) * 0.004);
        ctx.globalAlpha = 0.10 + (mI % 3) * 0.05;
        ctx.fillStyle = mI % 2 ? '#ffd9a0' : '#bfe0ff';
        U.circle(ctx, mx, H - my, mr); ctx.fill();
      }
      ctx.globalAlpha = 1;

    ctx.restore();

    /* реактивное свечение сока снизу (цвет последнего среза) */

    if (worldish2 && Game.juiceV > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.16 * Game.juiceV;
      ctx.drawImage(Game.juiceTex(Game.juiceC), 0, H * 0.45, W, H * 0.75);
      ctx.restore();
    }

    if (Game.screen === 'menu' || Game.screen === 'modes') {
      if (!Game.menuFruits) Game.initMenuFruits();

      for (var k = 0; k < Game.menuFruits.length; k++) {

        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.translate(px, py);
        ctx.rotate(f.rot);
        ctx.drawImage(img2, -rr, -rr, rr * 2, rr * 2);
        ctx.restore();
      }
      ctx.restore();
    }
  };

  Game.drawSplats = function () {

        if (!p.active) continue;
        var a = p.alpha;
        if (a <= 0.01) continue;
        var k = p.kind;
        var isLight = (k === 'spark' || k === 'ember' || k === 'star' || k === 'bolt' || k === 'mist');
        if ((pass === 1) !== isLight) continue;
        ctx.globalAlpha = a;
        switch (k) {
          case 'juice':
            if (p.sprite) {
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
              var sc = 1 + (p.stretch || 0) * Math.min(1, Math.sqrt(p.vx * p.vx + p.vy * p.vy) / 900);
              ctx.scale(1, sc);
              var sz = p.r * 2.4;
              ctx.drawImage(p.sprite, -sz / 2, -sz / 2, sz, sz);
              ctx.restore();
            } else {
              ctx.fillStyle = p.color;
              U.circle(ctx, p.x, p.y, p.r); ctx.fill();
            }
            break;
          case 'mist':
            ctx.fillStyle = U.rgba(p.color, a * 0.30);
            U.circle(ctx, p.x, p.y, p.r * (1 + p.age * 2.2)); ctx.fill();
            break;
          case 'star':
            ctx.fillStyle = p.color;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.beginPath();
            for (var sI = 0; sI < 8; sI++) {
              var ang = sI * Math.PI / 4, rr2 = (sI % 2 === 0) ? p.r * 1.5 : p.r * 0.55;
              if (sI === 0) ctx.moveTo(Math.cos(ang) * rr2, Math.sin(ang) * rr2);
              else ctx.lineTo(Math.cos(ang) * rr2, Math.sin(ang) * rr2);
            }
            ctx.closePath(); ctx.fill(); ctx.restore();
            break;
          case 'bolt':
            ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, p.r * 0.5);
            ctx.beginPath();
            ctx.moveTo(p.x - p.r, p.y); ctx.lineTo(p.x + p.r, p.y - p.r * 0.6);
            ctx.lineTo(p.x - p.r * 0.4, p.y + p.r * 0.3); ctx.lineTo(p.x + p.r * 0.8, p.y + p.r);
            ctx.stroke();
            break;
          case 'petal':
            ctx.fillStyle = p.color;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.2, p.r * 0.6, 0, 0, U.TAU); ctx.fill();
            ctx.restore();
            break;
          case 'snow':
            ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, p.r * 0.32);
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.beginPath();
            for (var q = 0; q < 3; q++) {
              var an = q * Math.PI / 3;
              ctx.moveTo(-Math.cos(an) * p.r, -Math.sin(an) * p.r);
              ctx.lineTo(Math.cos(an) * p.r, Math.sin(an) * p.r);
            }
            ctx.stroke(); ctx.restore();
            break;
          case 'shadow':
            ctx.fillStyle = U.rgba('#1b1030', a * 0.8);
            U.circle(ctx, p.x, p.y, p.r * 1.3); ctx.fill();
            break;
          case 'rainbow':
            ctx.fillStyle = 'hsl(' + ((Game.sessionTime * 220 + p.x * 0.6 + p.y * 0.4) % 360) + ',95%,62%)';
            U.circle(ctx, p.x, p.y, p.r); ctx.fill();
            break;
          case 'smoke':
            ctx.fillStyle = U.rgba(p.color, a * 0.5);
            U.circle(ctx, p.x, p.y, p.r * (1 + p.age * 1.6)); ctx.fill();
            break;
          default:
            ctx.fillStyle = p.color;
            U.circle(ctx, p.x, p.y, p.r); ctx.fill();
        }
      }
      if (pass === 1) ctx.restore();
    }
    ctx.globalAlpha = 1;
  };

  Game.drawFx = function () {
    var ctx = Game.ctx, pool = Game.fx.a;
    var additive = false;
    for (var i = 0; i < pool.length; i++) {
      var f = pool[i];
      if (!f.active) continue;
      var k = 1 - f.age / f.life;
      if (f.kind === 'ring') {
        if (!additive) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; additive = true; }
        ctx.globalAlpha = k * 0.8;
        ctx.strokeStyle = f.color;
        ctx.lineWidth = Math.max(1, f.w * k);
        U.circle(ctx, f.x, f.y, f.r);
        ctx.stroke();
      } else {
        if (additive) { ctx.restore(); additive = false; }
        ctx.save();
        ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        ctx.fillStyle = f.color;
        ctx.fillRect(-f.r, -f.r * 0.6, f.r * 2, f.r * 1.2);
        ctx.restore();
      }
    }
    if (additive) ctx.restore();
    ctx.globalAlpha = 1;
  };

  Game._tx = new Float32Array(CFG.trailMax + 2);
  Game._ty = new Float32Array(CFG.trailMax + 2);
  Game._gx = new Float32Array(96);
  Game._gy = new Float32Array(96);

  /** Призрак рекордного реплея (только в daily с тем же сидом) */
  Game.drawGhost = function () {
    if (Game.mode !== 'daily' || !Store.data.replay) return;
    var rp = Store.data.replay;
    if (rp.seed !== Game.roundSeed || !rp.pts || rp.pts.length < 6) return;
    var tMs = (Game.round ? Game.round.t : 0) * 1000;
    var win = 300;
    var gx = Game._gx, gy = Game._gy, m = 0;
    for (var i = rp.pts.length - 3; i >= 0; i -= 3) {
      if (rp.pts[i] > tMs) continue;
      if (rp.pts[i] < tMs - win) break;
      if (m >= 96) break;
      var idx = m++;
      gx[idx] = rp.pts[i + 1]; gy[idx] = rp.pts[i + 2];
    }
    if (m < 2) return;
    /* массивы заполнены с конца к началу — разворачиваем индексацией с конца */
    var ctx = Game.ctx;
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Game.unit * 0.012;
    ctx.beginPath();
    for (var k = m - 1; k >= 0; k--) {
      if (k === m - 1) ctx.moveTo(gx[k], gy[k]);
      else ctx.lineTo(gx[k], gy[k]);
    }
    ctx.stroke();
    ctx.restore();
  };

  Game.drawTrail = function () {
    var n = Input.trail.length >> 1;
    if (n < 2) return;
    var now = Game.nowMs / 1000;
    var tx = Game._tx, ty = Game._ty, m = 0;
    for (var i = 0; i < n; i++) {
      var age = now - Input.trailT[i];
      if (age > CFG.trailLife) continue;
      if (m >= CFG.trailMax) break;
      tx[m] = Input.trail[i * 2]; ty[m] = Input.trail[i * 2 + 1]; m++;
    }
    if (m < 2) return;
    var blade = Blades.current();
    var ctx = Game.ctx;
    var base = Game.unit * 0.019 * (blade.w || 1) * (Game.feverT > 0 ? 1.35 : 1);
    var fade = 1;
    if (!Input.down) {
      var lastAge = now - Input.trailT[(n - 1)];
      fade = U.clamp(1 - lastAge / CFG.trailLife, 0, 1);
    }
    if (fade <= 0.02) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30 * fade;
    ctx.fillStyle = Game.feverT > 0 ? '#ffd84d' : blade.c1;
    Game.strokePoly(ctx, tx, ty, m, base * 2.8);
    ctx.fill();
    ctx.globalAlpha = 0.55 * fade;
    ctx.fillStyle = blade.c2;
    Game.strokePoly(ctx, tx, ty, m, base * 1.25);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.95 * fade;
    ctx.fillStyle = '#ffffff';
    Game.strokePoly(ctx, tx, ty, m, base * 0.55);
    ctx.fill();
    ctx.restore();

    var tipX = tx[m - 1], tipY = ty[m - 1];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.85 * fade;
    var gl = Game.glows[Game.feverT > 0 ? 'gold' : 'white'];
    var gs = base * 5;
    ctx.drawImage(gl, tipX - gs / 2, tipY - gs / 2, gs, gs);
    ctx.restore();
  };

  Game.strokePoly = function (ctx, tx, ty, m, w) {
    ctx.beginPath();
    var i, nx, ny, dx, dy, len, hw;
    for (i = 0; i < m; i++) {
      var t = m === 1 ? 1 : i / (m - 1);
      hw = w * (0.25 + 0.75 * Math.pow(t, 0.75)) * 0.5;
      if (i === 0) { dx = tx[1] - tx[0]; dy = ty[1] - ty[0]; }
      else if (i === m - 1) { dx = tx[m - 1] - tx[m - 2]; dy = ty[m - 1] - ty[m - 2]; }
      else { dx = tx[i + 1] - tx[i - 1]; dy = ty[i + 1] - ty[i - 1]; }
      len = Math.sqrt(dx * dx + dy * dy) || 1;
      nx = -dy / len; ny = dx / len;
      if (i === 0) ctx.moveTo(tx[i] + nx * hw, ty[i] + ny * hw);
      else ctx.lineTo(tx[i] + nx * hw, ty[i] + ny * hw);
    }
    for (i = m - 1; i >= 0; i--) {
      var t2 = m === 1 ? 1 : i / (m - 1);
      var hw2 = w * (0.25 + 0.75 * Math.pow(t2, 0.75)) * 0.5;
      var dx2, dy2;
      if (i === 0) { dx2 = tx[1] - tx[0]; dy2 = ty[1] - ty[0]; }
      else if (i === m - 1) { dx2 = tx[m - 1] - tx[m - 2]; dy2 = ty[m - 1] - ty[m - 2]; }
      else { dx2 = tx[i + 1] - tx[i - 1]; dy2 = ty[i + 1] - ty[i - 1]; }
      var len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
      ctx.lineTo(tx[i] + (dy2 / len2) * hw2, ty[i] - (dx2 / len2) * hw2);
    }
    ctx.closePath();
  };

  Game.drawPopups = function () {
    var ctx = Game.ctx, pool = Game.popups.a;
    for (var i = 0; i < pool.length; i++) {
      var p = pool[i];
      if (!p.active) continue;
      var k = p.age / p.life;
      var alpha = k < 0.12 ? k / 0.12 : (1 - Math.pow(Math.max(0, (k - 0.55) / 0.45), 2));
      var sc = p.scale * (1 + (p.kind === 'combo' ? 0.06 * Math.sin(p.age * 22) : 0));
      ctx.save();
      ctx.globalAlpha = U.clamp(alpha, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.scale(sc, sc);
      var size = p.size;
      if (p.kind === 'combo') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.22 * (1 - k);
        ctx.rotate(p.age * 0.8);
        ctx.fillStyle = p.color;
        for (var rI = 0; rI < 6; rI++) {
          ctx.rotate(Math.PI / 3);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(size * 1.5, -size * 0.14);
          ctx.lineTo(size * 1.5, size * 0.14);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
      var font = '900 ' + size + 'px ' + U.FONT;
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(2, size * 0.18);
      ctx.strokeStyle = p.kind === 'combo' ? 'rgba(120,20,60,.9)' : 'rgba(20,10,40,.8)';
      ctx.strokeText(p.text, 0, 0);
      if (p.kind === 'combo') {
        var g = ctx.createLinearGradient(0, -size * 0.6, 0, size * 0.6);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.5, p.color);
        g.addColorStop(1, U.shade(p.color.charAt(0) === '#' ? p.color : '#ffffff', -0.25));
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = p.color;
      }
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  };

  /* ------------------------------- HUD v2 ------------------------------ */
  Game.drawHUD = function () {
    var ctx = Game.ctx, W = Game.W, u = Game.unit;
    var pad = Math.max(10, u * 0.03);
    var top = pad + Game.topInset();
    ctx.save();
    ctx.textBaseline = 'middle';

    var mir = !!Store.data.settings.mirror;
    var fs = u * 0.075;
    var scoreTxt = String(Game.score);
    ctx.font = '900 ' + fs + 'px ' + U.FONT;
    var tw = U.tw(ctx, scoreTxt, ctx.font);
    var bw = tw + fs * 0.9, bh = fs * 1.5;
    var pop = 1 + Game.scorePop * 0.14;
    ctx.save();
    ctx.translate(mir ? (W - pad - bw) : pad, top);
    ctx.scale(pop, pop);
    ctx.fillStyle = 'rgba(10,6,24,.55)';
    U.rr(ctx, 0, 0, bw, bh, bh * 0.32); ctx.fill();
    ctx.strokeStyle = U.rgba(Game.feverT > 0 ? '#ffd84d' : '#ffffff', 0.28);
    ctx.lineWidth = Math.max(1, u * 0.004);
    U.rr(ctx, 0, 0, bw, bh, bh * 0.32); ctx.stroke();
    ctx.fillStyle = Game.feverT > 0 ? '#ffd84d' : '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(scoreTxt, bw / 2, bh * 0.54);
    ctx.restore();

    var mw = u * 0.42, mh = u * 0.020, mx = mir ? (W - pad - mw) : pad, my = top + bh + u * 0.018;
    ctx.fillStyle = 'rgba(10,6,24,.55)';
    U.rr(ctx, mx, my, mw, mh, mh / 2); ctx.fill();
    var fk = U.clamp(Game.fever / CFG.feverMax, 0, 1);
    if (fk > 0) {
      var fg = ctx.createLinearGradient(mx, 0, mx + mw, 0);
      fg.addColorStop(0, '#ff9d2e'); fg.addColorStop(1, '#ffd84d');
      ctx.fillStyle = fg;
      U.rr(ctx, mx, my, mw * fk, mh, mh / 2); ctx.fill();
      if (Game.feverT > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.5 + Math.sin(Game.sessionTime * 12) * 0.2;
        ctx.fillStyle = '#ffd84d';
        U.rr(ctx, mx, my - mh * 0.4, mw * fk, mh * 1.8, mh); ctx.fill();
        ctx.restore();
      }
    }
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = Math.max(1, u * 0.003);
    U.rr(ctx, mx, my, mw, mh, mh / 2); ctx.stroke();

    if (Game.mode !== 'classic' && (Game.screen === 'playing' || Game.screen === 'paused')) {
      var tl = Math.max(0, Game.timeLeft);
      var total = Game.mode === 'arcade' ? CFG.arcadeTime : CFG.zenTime;
      var cx2 = W / 2, cy2 = top + u * 0.055, rr = u * 0.052;
      var col = tl <= 5 ? '#ff5a5a' : (tl <= 10 ? '#ffdf6b' : '#ffffff');
      ctx.lineWidth = u * 0.012;
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      U.circle(ctx, cx2, cy2, rr); ctx.stroke();
      ctx.strokeStyle = col;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx2, cy2, rr, -Math.PI / 2, -Math.PI / 2 + U.TAU * U.clamp(tl / total, 0, 1));
      ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.fillStyle = col;
      ctx.font = '900 ' + (u * 0.042) + 'px ' + U.FONT;
      ctx.textAlign = 'center';
      ctx.fillText(tl.toFixed(tl < 10 ? 1 : 0), cx2, cy2 + u * 0.002);
    }

    if (Game.mode === 'classic' && (Game.screen === 'playing' || Game.screen === 'paused')) {
      var hs = u * 0.052;
      var pauseW = u * 0.105 + Math.max(8, u * 0.025);
      var heartsW = CFG.classicLives * hs * 1.35;
      var hx = mir ? (pad + pauseW + u * 0.03) : (W - pauseW - u * 0.03 - heartsW);
      for (var i = 0; i < CFG.classicLives; i++) {
        var alive = i < Game.lives;
        Game.drawHeart(hx + i * (hs * 1.35) + hs / 2, top + hs * 0.75, hs, alive);
      }
    }

    var by = top + bh + u * 0.055;
    if (Game.freezeT > 0) { Game.drawBuff(mir ? (W - pad - u * 0.30) : pad, by, I18N.t('freeze_on'), Game.freezeT / CFG.freezeTime, '#a8ecff'); by += u * 0.05; }
    if (Game.doubleT > 0) { Game.drawBuff(pad, by, I18N.t('double_on'), Game.doubleT / CFG.doubleTime, '#c9a2ff'); by += u * 0.05; }
    if (Game.slowmoT > 0) { Game.drawBuff(pad, by, 'SLOW-MO', Game.slowmoT / CFG.slowmoRewardTime, '#9fe8ff'); by += u * 0.05; }
    if (Game.feverT > 0) { Game.drawBuff(pad, by, I18N.t('fever'), Game.feverT / CFG.feverTime, '#ffd84d'); }
    ctx.restore();
  };

  Game.drawHeart = function (x, y, s, alive) {
    var ctx = Game.ctx;
    var img = Assets.get('ui_heart.png');
    ctx.save();
    ctx.globalAlpha = alive ? 1 : 0.20;
    if (img) ctx.drawImage(img, x - s / 2, y - s / 2, s, s);
    else {
      ctx.fillStyle = alive ? '#ff3b6b' : '#8b7fa8';
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.36);
      ctx.bezierCurveTo(x - s * 0.62, y - s * 0.12, x - s * 0.30, y - s * 0.52, x, y - s * 0.18);
      ctx.bezierCurveTo(x + s * 0.30, y - s * 0.52, x + s * 0.62, y - s * 0.12, x, y + s * 0.36);
      ctx.fill();
    }
    ctx.restore();
  };

  Game.drawBuff = function (x, y, text, k, color) {
    var ctx = Game.ctx, u = Game.unit;
    var w = u * 0.30, h = u * 0.036;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(10,6,24,.55)';
    U.rr(ctx, x, y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = color;
    U.rr(ctx, x, y, w * U.clamp(k, 0, 1), h, h / 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '800 ' + (h * 0.72) + 'px ' + U.FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + h * 0.5, y + h * 0.55);
    ctx.restore();
  };

  /* ------------------------------ КНОПКИ v2 ---------------------------- */
  Game.drawIcon = function (name, x, y, s, alpha) {
    var ctx = Game.ctx;
    var img = Assets.get(name);
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    if (img) ctx.drawImage(img, x, y, s, s);
    else {
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = Math.max(1.5, s * 0.09);
      var cx = x + s / 2, cy = y + s / 2, r = s * 0.34;
      ctx.beginPath();
      if (name === 'ui_play.png') { ctx.moveTo(cx - r * 0.7, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx - r * 0.7, cy + r); ctx.closePath(); ctx.fill(); }
      else if (name === 'ui_pause.png') { ctx.fillRect(cx - r * 0.8, cy - r, r * 0.55, r * 2); ctx.fillRect(cx + r * 0.25, cy - r, r * 0.55, r * 2); }
      else if (name === 'coin.png' || name === 'ui_coin_btn.png') { ctx.arc(cx, cy, r, 0, U.TAU); ctx.fillStyle = '#ffdf6b'; ctx.fill(); ctx.strokeStyle = '#c9971a'; ctx.stroke(); }
      else if (name === 'ui_back.png') { ctx.moveTo(cx + r * 0.6, cy - r); ctx.lineTo(cx - r * 0.7, cy); ctx.lineTo(cx + r * 0.6, cy + r); ctx.stroke(); }
      else if (name === 'ui_lock.png') { ctx.rect(cx - r * 0.8, cy - r * 0.1, r * 1.6, r * 1.2); ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy - r * 0.2, r * 0.55, Math.PI, 0); ctx.stroke(); }
      else if (name === 'ui_star.png') { Game.starPath(ctx, cx, cy, r * 1.2, r * 0.55, 5); ctx.fillStyle = '#ffdf6b'; ctx.fill(); }
      else if (name === 'ui_heart.png') { Game.drawHeart(cx, cy, s * 0.8, true); }
      else if (name === 'ui_share.png') { ctx.arc(cx + r * 0.5, cy - r * 0.5, r * 0.35, 0, U.TAU); ctx.fill(); ctx.arc(cx - r * 0.5, cy, r * 0.35, 0, U.TAU); ctx.fill(); ctx.arc(cx + r * 0.5, cy + r * 0.5, r * 0.35, 0, U.TAU); ctx.fill(); }
      else if (name === 'ui_quest.png') { ctx.rect(cx - r * 0.7, cy - r * 0.8, r * 1.4, r * 1.7); ctx.fill(); }
      else { U.circle(ctx, cx, cy, r); ctx.stroke(); }
    }
    ctx.restore();
  };

  Game.starPath = function (ctx, cx, cy, R, r, n) {
    ctx.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var rad = (i % 2 === 0) ? R : r;
      var a = -Math.PI / 2 + i * Math.PI / n;
      if (i === 0) ctx.moveTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
      else ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
  };

  Game.drawButton = function (b) {
    var ctx = Game.ctx, u = Game.unit;
    var y = b.list ? b.y - Game.scroll : b.y;
    if (y + b.h < -u * 0.2 || y > Game.H + u * 0.2) return;
    var press = b.press ? 0.955 : 1;
    ctx.save();
    if (press !== 1) { ctx.translate(b.x + b.w / 2, y + b.h / 2); ctx.scale(press, press); ctx.translate(-(b.x + b.w / 2), -(y + b.h / 2)); }
    var st = b.style;
    var dis = (st === 'disabled' || !b.enabled);
    ctx.globalAlpha = dis ? 0.45 : 1;

    if (st === 'icon') {
      ctx.fillStyle = 'rgba(18,10,38,.55)';
      U.rr(ctx, b.x, y, b.w, b.h, b.h * 0.28); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = Math.max(1, u * 0.004);
      U.rr(ctx, b.x, y, b.w, b.h, b.h * 0.28); ctx.stroke();
      var isz = b.w * 0.56;

  Game.wrapTextLeft = function (text, x, y, maxW, lh, font, maxLines) {
    var ctx = Game.ctx;
    ctx.font = font;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var words = String(text).split(' ');
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var t = cur ? cur + ' ' + words[i] : words[i];
      if (U.tw(ctx, t, font) > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    maxLines = maxLines || 3;
    for (var j = 0; j < Math.min(maxLines, lines.length); j++) ctx.fillText(lines[j], x, y + j * lh);
  };

  Game.wrapText = function (text, cx, cy, maxW, lh, font) {
    var ctx = Game.ctx;
    ctx.font = font;
    var words = String(text).split(' ');
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {

      if (U.tw(ctx, t, font) > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = t;
    }
    if (cur) lines.push(cur);

  Game.drawTitle = function (cx, cy, size) {
    var ctx = Game.ctx;
    var text = I18N.t('app_title');
    var fnt = U.fitFont(ctx, text, size, U.FONT, Game.W * 0.86, '900');
    ctx.save();
    ctx.font = fnt;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    var px = parseFloat(fnt.split(' ')[1]) || size;
    var ent = U.clamp((Game.menuT - 0.05) / 0.55, 0, 1);
    var sc = 0.7 + 0.3 * U.easeElastic(ent);
    ctx.translate(cx, cy);
    ctx.scale(sc, sc);
    ctx.lineWidth = px * 0.18;
    ctx.strokeStyle = 'rgba(40,8,60,.8)';
    ctx.strokeText(text, 0, 0);
    var g = Game._titleGrad;
    if (!g || Game._titleKey !== Math.round(px)) {
      g = ctx.createLinearGradient(0, -px * 0.6, 0, px * 0.6);
      g.addColorStop(0, '#fff6c9'); g.addColorStop(0.45, '#ffd84d'); g.addColorStop(1, '#ff7a45');
      Game._titleGrad = g; Game._titleKey = Math.round(px);
    }
    ctx.fillStyle = g;
    ctx.fillText(text, 0, 0);
    if (ent >= 1) {
      var w = U.tw(ctx, text, fnt);
      var shX = ((Game.sessionTime * 0.35) % 1.6 - 0.3) * w;
      ctx.save();
      ctx.beginPath();
      ctx.rect(-w / 2, -px * 0.75, w, px * 1.5);
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      var sg = ctx.createLinearGradient(shX - w * 0.12, 0, shX + w * 0.12, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)');
      sg.addColorStop(0.5, 'rgba(255,255,255,.5)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg;
      ctx.transform(1, 0, -0.35, 1, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  };

    var msg = step === 1 ? I18N.t('tut_1') : (step === 2 ? I18N.t('tut_2') : I18N.t('tut_3'));
    ctx.font = U.fitFont(ctx, msg, u * 0.045, U.FONT, W * 0.84, '900');
    Game.wrapText(msg, W / 2, py + ph * 0.52, W * 0.84, u * 0.05, ctx.font);
    ctx.fillStyle = '#ffdf6b';
    var hint = step === 1 ? I18N.t('tut_1_hint') : (step === 2 ? I18N.t('tut_2_hint') : I18N.t('tut_3_hint'));
    ctx.font = '700 ' + (u * 0.028) + 'px ' + U.FONT;
    ctx.fillText(hint, W / 2, py + ph * 0.86, W * 0.86);

    if (step === 2) {
      var br = u * 0.16, bx = W / 2, by = H * 0.50;
      var gl = Game.glows.bomb;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55 + Math.sin(Game.sessionTime * 5) * 0.12;
      ctx.drawImage(gl, bx - br * 1.8, by - br * 1.8, br * 3.6, br * 3.6);
      ctx.restore();
      var img = Assets.get('bomb.png');
      if (img) ctx.drawImage(img, bx - br, by - br, br * 2, br * 2);
      else { ctx.fillStyle = '#20202a'; U.circle(ctx, bx, by, br); ctx.fill(); }
      ctx.strokeStyle = '#ff4a4a'; ctx.lineWidth = u * 0.014; ctx.lineCap = 'round';

      for (var i = 0; i < Game.fruits.n; i++) if (Game.fruits.a[i].active) { f = Game.fruits.a[i]; break; }
      if (f) {
        var t2 = (Game.sessionTime * 1.4) % 1;

        ctx.lineWidth = u * 0.012;

        ctx.beginPath();
        ctx.moveTo(ax - f.r * 0.22, f.y - f.r * 0.22);

  };

  Game.drawToasts = function () {
    if (!Game.toasts.length) return;
    var ctx = Game.ctx, u = Game.unit, W = Game.W;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < Game.toasts.length; i++) {
      var t = Game.toasts[i];
      var k = t.age / t.life;
      var alpha = k < 0.1 ? k / 0.1 : (k > 0.8 ? (1 - k) / 0.2 : 1);
      var w = Math.min(W * 0.86, u * 0.86), h = u * 0.10;
      var y = u * 0.20 + i * (h + u * 0.014) - U.easeOut(Math.min(1, k * 6)) * u * 0.02;
      ctx.globalAlpha = U.clamp(alpha, 0, 1);

      ctx.strokeStyle = U.rgba(t.color, 0.75); ctx.lineWidth = Math.max(1, u * 0.004);
      U.rr(ctx, W / 2 - w / 2, y, w, h, h * 0.32); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '900 ' + (h * 0.34) + 'px ' + U.FONT;
      ctx.fillText(t.text, W / 2, y + (t.sub ? h * 0.36 : h * 0.5), w * 0.92);
      if (t.sub) {

  Game.drawOverlays = function () {
    var ctx = Game.ctx, W = Game.W, H = Game.H;
    if (Game.freezeT > 0 || Game.slowmoT > 0) {
      var k = Game.freezeT > 0 ? U.clamp(Game.freezeT / CFG.freezeTime, 0, 1) : U.clamp(Game.slowmoT / CFG.slowmoRewardTime, 0, 1);
      ctx.save();
      ctx.fillStyle = U.rgba('#7fd8ff', 0.10 + 0.06 * k);
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (Game.feverT > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      ctx.fillStyle = '#ffd84d';

      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#ffd84d';
      for (var dI = 0; dI < 7; dI++) {
        var dx = W * (dI + 0.5) / 7 + Math.sin(Game.sessionTime * 1.3 + dI * 2.1) * W * 0.02;
        var dl = H * (0.05 + 0.045 * (0.5 + 0.5 * Math.sin(Game.sessionTime * 2.2 + dI * 1.7)));

    ctx.restore();

      ctx.fillRect(0, 0, W, H);
      ctx.restore();

  Game.render = function () {
    var ctx = Game.ctx;
    if (!ctx) return;
    /* адаптивное качество: при плотном потоке отключаем дорогие декорации,

    Game.qLow = (Game.fruits.used > 14) || (Game.parts.used > 220) || (Game.halves.used > 24);
    ctx.setTransform(Game.DPR, 0, 0, Game.DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.save();

      ctx.translate(-Game.W / 2, -Game.H / 2);
    }
    if (Game.shake > 0.2) {
      var m = Game.shake;
      ctx.translate((Game.rng() * 2 - 1) * m, (Game.rng() * 2 - 1) * m);
    }
    Game.drawBackground();
    var world = (Game.screen === 'playing' || Game.screen === 'paused' || Game.screen === 'tutorial' || Game.screen === 'gameover' || Game.screen === 'replay');
    if (world) {
      Game.drawSplats();
      Game.drawFruits();
      Game.drawHalves();
      Game.drawParticles();
      Game.drawFx();
      Game.drawGhost();
      Game.drawTrail();

  /* ---------------------------- ГЛАВНЫЙ ЦИКЛ -------------------------- */
  Game.frame = function () {
    Game._raf = requestAnimationFrame(Game.frame);
    var t0 = U.now();
    /* страховка: на экранных экранах пауза не может блокировать UI */
    if (Game.paused && Game.screen !== 'playing' && Game.screen !== 'tutorial' && Game.screen !== 'paused') {
      Game._pAd = false; Game._pUser = false; Game._pPlat = false;
      Game.paused = false;
      Snd.setPaused(false);
      Game.logMsg('unpause-selfheal:' + Game.screen);
    }
    Game.nowMs = t0;
    var dt = Game._lastTs ? (t0 - Game._lastTs) / 1000 : 1 / 60;
    Game._lastTs = t0;
    if (!isFinite(dt) || dt < 0) dt = 1 / 60;
    if (dt > 0.25) dt = 0.25;
    if (!isFinite(Game.acc)) Game.acc = 0;

    var pf = Game.perf;
    pf.frames++;
    var ft = dt * 1000;
    pf.ftBuf[pf.ftI] = ft; pf.ftI = (pf.ftI + 1) % pf.ftBuf.length;
    pf.ftN = Math.min(pf.ftBuf.length, pf.ftN + 1);
    if (ft > pf.worst) { pf.worst = ft; pf.worstAt = pf.frames; }
    pf.worst *= 0.999;

    var ts0 = U.now();
    if (!Game.paused) Game.step(dt);
    var ts1 = U.now();
    pf.physMs = ts1 - ts0;
    pf.physSum += pf.physMs; pf.physN++;
    pf.physAvg = pf.physSum / pf.physN;
    if (pf.physMs > pf.physMax) pf.physMax = pf.physMs;

    Game.render();
    var ts2 = U.now();
    pf.drawMs = ts2 - ts1;
    if (pf.drawMs > pf.drawMax) pf.drawMax = pf.drawMs;
    pf.frameMs = ts2 - t0;

    if (pf.frames % 15 === 0) {
      var sum = 0, n = Math.min(60, pf.ftN);
      for (var i = 0; i < n; i++) sum += pf.ftBuf[(pf.ftI - 1 - i + pf.ftBuf.length) % pf.ftBuf.length];
      pf.fps = n > 0 ? 1000 / (sum / n) : 60;
    }
  };

  Game.startLoop = function () {
    if (Game._started) return;
    Game._started = true;
    Game._lastTs = U.now();

  };

  Game.stopLoop = function () {
    if (Game._raf) cancelAnimationFrame(Game._raf);
    Game._raf = 0; Game._started = false;
  };

  /* ============ ЧАСТЬ H: ПАУЗА, ПЛАТФОРМА, ЗАПУСК, DEBUG =============== */

  Game._pAd = false; Game._pUser = false; Game._pPlat = false;
  Game.anyPause = function () { return Game._pAd || Game._pUser || Game._pPlat; };

  Game.setPaused = function (p, reason) {
    reason = reason || 'user';
    if (p) {
      if (reason === 'ad') Game._pAd = true;
      else if (reason === 'platform') Game._pPlat = true;
      else Game._pUser = true;
    } else {
      if (reason === 'ad') Game._pAd = false;
      else if (reason === 'platform') Game._pPlat = false;
      else Game._pUser = false;
    }
    var want = Game.anyPause();
    if (want && !Game.paused) {
      Game.paused = true; Game.acc = 0;
      Snd.setPaused(true);
      Game.logMsg('pause:' + reason);
    } else if (!want && Game.paused) {
      Game.paused = false; Game.acc = 0; Game._lastTs = U.now();
      Snd.setPaused(false);
      Game.logMsg('resume:' + reason);
    }
    return Game.paused;
  };

  Game.togglePause = function () {
    if (Game.screen === 'paused') {
      Game.setPaused(false, 'user');
      Game.screen = 'playing';
      Game.layoutScreen();
      Snd.play('ui');
      return;
    }
    if (Game.screen !== 'playing') return;
    Game.setPaused(true, 'user');
    Game.screen = 'paused';
    Game.layoutScreen();
    Snd.play('ui');
  };

  Game.onPlatformPause = function () {
    Game.setPaused(true, 'platform');
    if (Game.screen === 'playing') { Game.screen = 'paused'; Game.layoutScreen(); }
  };
  Game.onPlatformResume = function () {
    Game.setPaused(false, 'platform');
    if (Game.screen === 'paused' && !Game._pUser && !Game._pAd) {
      Game.screen = 'playing';
      Game.layoutScreen();
    }
  };

  Game.bindPlatform = function (pl) {
    if (!pl || !pl.on) return;
    pl.on('pause', Game.onPlatformPause);
    pl.on('resume', Game.onPlatformResume);
    pl.on('ads:start', function () { Game.setPaused(true, 'ad'); });
    pl.on('ads:close', function () { Game.setPaused(false, 'ad'); });
    pl.on('mute', function (m) { Snd.setPlatformMuted(m); });
    pl.on('mute:music', function (m) { if (m) Snd.stopMusic(); else Snd.applySettings(); });
    pl.on('language', function (l) { if (l) Game.setLang(l, false); });
    pl.on('orientation', function () { Game.resize(); });
    pl.on('banner', function (h) {
      Game.stickyInset = Math.max(0, h | 0);
      Game.resize();
    });
    Game._platBound = true;
  };

  Game.bindResize = function () {
    if (Game._resizeBound) return;
    Game._resizeBound = true;
    var pending = false;
    function doResize() { pending = false; try { Game.resize(); } catch (e) { Game.logMsg('resize-error'); } }
    function onR() { if (!pending) { pending = true; requestAnimationFrame(doResize); } }
    window.addEventListener('resize', onR);
    window.addEventListener('orientationchange', function () { onR(); setTimeout(onR, 150); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onR);
      window.visualViewport.addEventListener('scroll', onR);
    }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { Store.flush(); Game.setPaused(true, 'platform'); }
      else { Game._lastTs = U.now(); Game.setPaused(false, 'platform'); }

    window.addEventListener('wheel', function (e) {
      if (UI.listArea && Game.scrollMax > 0) {
        Game.scroll = U.clamp(Game.scroll + (e.deltaY || 0) * 0.7, 0, Game.scrollMax);
        e.preventDefault();

    }, { passive: false });
    window.addEventListener('pagehide', function () { try { Store.flush(); } catch (e) { } });
    window.addEventListener('beforeunload', function () { try { Store.flush(); } catch (e) { } });
    /* авто-пауза при потере фокуса окном/iframe (звонок, свернуть) */
    window.addEventListener('blur', function () {
      if (Game.screen === 'playing') Game.onPlatformPause();

    Game.cv.addEventListener('pointermove', function (ev) {

      Game.parTX = ((ev.clientX - r.left) / Math.max(1, Game.W) - 0.5) * 2;

  Game.finishBoot = function (reason) {

    if (!Game.platform) {
      var la = new FS.LocalAdapter({});
      try { la.init(); } catch (e) { }

    Game.applyMusic();

    }

  Game.boot = function (opts) {
    opts = opts || {};
    Game.opts = opts;
    var cv = opts.canvas || document.getElementById('game');
    if (!cv) {

      cv.id = 'game';
      document.body.appendChild(cv);
    }
    Game.cv = cv;
    Game.ctx = cv.getContext('2d', { alpha: false, desynchronized: true });
    Game.seed = opts.seed || ((Date.now() ^ 0x9e3779b9) >>> 0) || 1;
    Game.rng = FS.RNG.mulberry32(Game.seed);

    }, opts.bootTimeout || 7000);

        sessionTime: Game.sessionTime, round: Game.round ? {
