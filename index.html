      for (var j = 0; j < h.length; j++) {
        var q = h[j];
        if (!q.active) continue;
        out.push({ id: -1, ent: 'half', kind: q.type.id, x: q.x, y: q.y, vx: q.vx, vy: q.vy, r: q.r, rot: q.baseRot + q.rot, age: q.age, side: q.side });
      }
      return out;
    },

    fruitCount: function () {
      var n = 0, f = Game.fruits.a;
      for (var i = 0; i < f.length; i++) if (f[i].active) n++;
      return n;
    },

    pools: function () {
      return {
        fruits: { used: Game.fruits.used, n: Game.fruits.n, recycled: Game.fruits.recycled },
        halves: { used: Game.halves.used, n: Game.halves.n, recycled: Game.halves.recycled },
        parts: { used: Game.parts.used, n: Game.parts.n, recycled: Game.parts.recycled },
        popups: { used: Game.popups.used, n: Game.popups.n },
        splats: { used: Game.splats.used, n: Game.splats.n },
        fx: { used: Game.fx.used, n: Game.fx.n },
        halfCache: Game.halfCache.busyCount(),
        halfCacheN: Game.halfCache.items.length,
        toasts: Game.toasts.length,
        buttons: Game.buttons.length
      };
    },

    perf: function () {
      var pf = Game.perf;
      var worst = 0, sum = 0, n = Math.min(pf.ftN, pf.ftBuf.length), over33 = 0;
      for (var i = 0; i < n; i++) {
        var v = pf.ftBuf[i];
        if (v > worst) worst = v;
        sum += v;
        if (v > 33.4) over33++;
      }
      var mem = (window.performance && performance.memory) ? performance.memory.usedJSHeapSize : -1;
      return {
        fps: pf.fps, frames: pf.frames, avgFrameMs: n ? sum / n : 0, worstFrameMs: worst,
        over33ms: over33, samples: n,
        physAvgMs: pf.physAvg, physMaxMs: pf.physMax, physLastMs: pf.physMs,
        drawMaxMs: pf.drawMax, drawLastMs: pf.drawMs, adDelay: pf.adDelay,
        heap: mem, heapMB: mem > 0 ? mem / 1048576 : -1
      };
    },

    counters: function () {
      var c = {};
      for (var k in Game.counters) if (Object.prototype.hasOwnProperty.call(Game.counters, k)) c[k] = Game.counters[k];
      c.segs = Input.segs;
      return c;
    },

    sound: function () { return Snd.state(); },

    swipe: function (pts, opt) { return Input.injectPath(pts, opt); },
    startRound: function (mode, opt) { return Game.startRound(mode, opt); },
    endRound: function (r) { return Game.endRound(r || 'debug'); },
    spawn: function (id, opt) { var f = Game.spawnType(id, opt); return f ? { id: f.id, x: f.x, y: f.y, vx: f.vx, vy: f.vy, r: f.r } : null; },
    goto: function (s) { Game.screen = s; Game.layoutScreen(); return s; },
    setLang: function (l) { return Game.setLang(l, true); },
    getLang: function () { return Game.lang; },
    setPaused: function (p, r) { return Game.setPaused(p, r || 'user'); },
    triggerPause: function () { Game.onPlatformPause(); return Game.paused; },
    triggerResume: function () { Game.onPlatformResume(); return Game.paused; },
    setScore: function (v) { Game.score = v | 0; },
    setLives: function (v) { Game.lives = v | 0; },
    setTimeLeft: function (v) { Game.timeLeft = v; },
    setRoundTime: function (v) { if (Game.round) { Game.round.t = v; Game.round.progress = P.difficulty(v, Game.mode); } },
    setSticky: function (px) { Game.stickyInset = px | 0; Game.resize(); },
    setFever: function (v) { Game.fever = v; if (v >= CFG.feverMax && Game.feverT <= 0) Game.startFever(); return Game.feverT; },

    getSave: function () { return JSON.parse(JSON.stringify(Store.data)); },
    setSave: function (d) { Store.data = d; Store.flush(); Game.layoutScreen(); return true; },
    resetSave: function () { try { localStorage.removeItem(CFG.saveKey); } catch (e) { } Store.data = FS.defaults(); Store.flush(); return true; },
    flush: function () { Store.flush(); return Store.saveCount; },
    localRaw: function () { try { return localStorage.getItem(CFG.saveKey); } catch (e) { return null; } },

    giveCoins: function (n) { return Store.addCoins(n | 0); },
    unlockAll: function () {
      for (var i = 0; i < I18N.BLADES.length; i++) {
        var b = I18N.BLADES[i];
        if (Store.data.blades_unlocked.indexOf(b.id) < 0) Store.data.blades_unlocked.push(b.id);
      }
      Store.flush(); Game.layoutScreen();
      return Store.data.blades_unlocked.length;
    },
    equipBlade: function (id) { return Blades.equip(id); },
    buyBlade: function (id) { return Blades.buy(Blades.byId(id)); },
    unlockAllAch: function () {
      for (var i = 0; i < I18N.ACH.length; i++) {
        var a = I18N.ACH[i];
        if (Store.data.achievements.indexOf(a.id) < 0) Store.data.achievements.push(a.id);
      }
      Store.flush();
      return Store.data.achievements.length;
    },
    blades: function () {
      return I18N.BLADES.map(function (b) {
        return { id: b.id, tier: b.tier, cost: b.cost, owned: Blades.owned(b.id), can: Blades.canBuy(b), req: b.req || null, reqAchCount: b.reqAchCount || 0, equipped: Store.data.blade_equipped === b.id };
      });
    },
    achievements: function () {
      return I18N.ACH.map(function (a) {
        return { id: a.id, done: Achievements.has(a.id), cur: Achievements.progress(a), goal: a.goal, coins: a.coins, type: a.type };
      });
    },
    quests: function () { return JSON.parse(JSON.stringify(Quests.list())); },
    openRating: function () { Game.openRating(); return Game.screen; },
    openDuel: function () { Game.openDuel(); return Game.screen; },
    openEvent: function () { Game.openEvent(); return Game.screen; },
    openDex: function () { Game.openDex(); return Game.screen; },
    events: function () { var ev = Events.current(); return { id: ev.id, days: Events.daysLeft(), qs: JSON.parse(JSON.stringify(Events.list())), tint: ev.tint }; },
    claimEvent: function (i) { return Events.claim(i); },
    duelEnter: function (code) { Game.duelBuf = String(code); Game.duelStart(); return { seed: Game.roundSeed, mode: Game.mode, target: Game.duelTarget }; },
    duelCreate: function () { Game.duelCreate(); return Game.roundSeed; },
    roundSeed: function () { return Game.roundSeed; },
    startReplay: function () { return Game.startReplay(); },
    stopReplay: function () { Game.stopReplay(); return Game.screen; },
    replayInfo: function () { var r = Store.data.replay; return r ? { seed: r.seed, score: r.score, mode: r.mode, pts: r.pts.length / 3 } : null; },
    fruitStats: function () { return JSON.parse(JSON.stringify(Store.data.fruit_stats || {})); },
    setSens: function (v) { Store.data.settings.sens = v | 0; Store.save(); return Input.minLen(); },
    minLen: function () { return Input.minLen(); },
    setMirror: function (v) { Store.data.settings.mirror = !!v; Store.save(); Game.layoutScreen(); return !!v; },
    setCb: function (v) { Store.data.settings.cb = !!v; Store.save(); return !!v; },
    setSet: function (v) { Store.data.settings.set = v; Store.save(); return v; },
    bossInfo: function () {
      var f = Game.fruits.a;
      for (var i = 0; i < f.length; i++) if (f[i].active && f[i].kind === 'boss') return { hp: f[i].hp, r: f[i].r };
      return null;
    },
    dailyBest: function () { return JSON.parse(JSON.stringify(Store.data.daily_best || {})); },
    claimQuest: function (i) { return Game.claimQuest(i), Store.data.coins; },
    claimDaily: function () { return Game.claimDaily(), Store.data.coins; },
    setDailyDate: function (k) { Daily._setDate(k); return Store.data.daily; },
    share: function () { return Game.share(); },
    shareCardSize: function () {
      try { var cv = Game.makeCard(); return cv.width * cv.height > 0 ? cv.toDataURL('image/png').length : 0; } catch (e) { return 0; }
    },
    addXp: function (n) { return FS.Levels.add(n | 0), { level: Store.data.stats.level, xp: Store.data.stats.xp }; },
    lbList: function () { return Game.lbList || null; },

    tutorialStep: function () { return Game.tutStep; },
    startTutorial: function () { Game.startTutorial(); return Game.tutStep; },
    skipTutorial: function () { Game.tutSkip(); return Game.screen; },

    heap: function () { return (performance.memory ? performance.memory.usedJSHeapSize : -1); },
    gc: function () { if (typeof window.gc === 'function') { window.gc(); return true; } return false; },
    clearEntities: function () {
      Game.fruits.clear(); Game.halves.clear(); Game.parts.clear(); Game.popups.clear(); Game.splats.clear(); Game.fx.clear();
      Input.reset();
      return { fruits: Game.fruits.used, halves: Game.halves.used, parts: Game.parts.used };
    },
    log: function () { return Game.log.slice(); },
    seed: function (s) { Game.seed = s >>> 0; Game.rng = FS.RNG.mulberry32(Game.seed); return Game.seed; },
    /** Сброс перф-буфера (для честных замеров окна нагрузки) */
    resetPerf: function () {
      var pf = Game.perf;
      pf.frames = 0; pf.ftI = 0; pf.ftN = 0; pf.worst = 0; pf.worstAt = 0;
      pf.physSum = 0; pf.physN = 0; pf.physAvg = 0; pf.physMax = 0; pf.drawMax = 0;
      for (var i = 0; i < pf.ftBuf.length; i++) pf.ftBuf[i] = 0;
      return true;
    },

    /** Пакетная инъекция свайпов внутри страницы (без накладных расходов CDP) */
    burstSwipes: function (count, spanMs) {
      count = count || 300; spanMs = spanMs || 5000;
      return new Promise(function (res) {
        var i = 0, t0 = U.now();
        function tick() {
          var now = U.now();
          var target = Math.min(count, Math.floor((now - t0) / spanMs * count) + 1);
          while (i < target && i < count) {
            var y = 200 + (i * 37) % 500, x0 = 10 + (i * 13) % 60;
            Input.injectPath([[x0, y], [Game.W - 10 - (i % 40), y + (i % 7) - 3]]);
            i++;
          }
          if (i < count) requestAnimationFrame(tick);
          else res({ done: i, ms: Math.round(now - t0) });
        }
        requestAnimationFrame(tick);
      });
    },

    stress: function (n) {
      n = n || 14;
      var made = 0;
      for (var i = 0; i < n; i++) {
        var t = Fruits.list[i % Fruits.list.length];
        var f = Game.spawn(t, { x: Game.W * (0.1 + 0.8 * (i / n)), force: true, noMiss: true });
        if (f) made++;
      }
      return made;
    },
    autoPlay: function (seconds, opts) {
      opts = opts || {};
      var until = U.now() + (seconds || 5) * 1000;
      var interval = opts.interval || 130;
      var last = 0;
      Game._autoUntil = until;
      function tick() {
        if (U.now() > until) { Game._autoUntil = 0; return; }
        if (Game.screen === 'playing' && !Game.paused && U.now() - last >= interval) {
          last = U.now();
          var bs = Game.fruits.a, best = null, bestV = 1e9, i, o;
          for (i = 0; i < bs.length; i++) {
            o = bs[i];
            if (!o.active || o.kind === 'bomb') continue;
            if (o.y < 70 || o.y > Game.H - 50) continue;
            var v = Math.abs(o.vy);
            if (v < bestV) { bestV = v; best = o; }
          }
          if (best) {
            var x = best.x + best.vx * 0.05, y = best.y + best.vy * 0.05;
            var safe = true;
            for (i = 0; i < bs.length; i++) {
              var b2 = bs[i];
              if (!b2.active || b2.kind !== 'bomb') continue;
              if (Math.abs(b2.x - x) < (b2.r + best.r) * 1.3 && Math.abs(b2.y - y) < best.r * 4 + b2.r) { safe = false; break; }
            }
            if (safe) {
              var y0 = y - best.r * 4, y1 = y + best.r * 4;
              Input.injectPath([[x, Math.max(2, y0)], [x + 2, (y0 + y1) / 2], [x, Math.min(Game.H - 2, y1)]]);
            }
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      return true;
    }
  };

  function autoStart() {
    try {
      var opts = window.__FS_BOOT_OPTS__ || {};
      var pc = {
        projectId: window.GP_PROJECT_ID,
        publicToken: window.GP_PUBLIC_TOKEN,
        saveField: window.GP_SAVE_FIELD || 'save',
        sticky: !!window.GP_SHOW_STICKY,
        preloader: !!window.GP_SHOW_PRELOADER
      };
      if (opts.platform) for (var k in opts.platform) if (Object.prototype.hasOwnProperty.call(opts.platform, k)) pc[k] = opts.platform[k];
      opts.platform = pc;
      if (pc.sticky) Game.stickyInset = Math.max(0, window.GP_STICKY_INSET || 0);
      Game.boot(opts);
    } catch (e) {
      Game.bootError = String((e && e.message) || e);
      try { Game.finishBoot('exception'); } catch (e2) { }
    }
  }

  FS.Game = Game;
  FS.autoStart = autoStart;

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', autoStart);
    else autoStart();
  }








})(window.FS = window.FS || {});


</script>

<script>
(function () {
  var bar = document.getElementById('bootbar');
  var box = document.getElementById('boot');
  var t = setInterval(function () {
    try {
      var A = window.FS && window.FS.Assets;
      var G = window.FS && window.FS.Game;
      if (A && A.total) bar.style.width = Math.round(100 * A.loaded / A.total) + '%';
      if (G && G.bootDone) {
        clearInterval(t);
        bar.style.width = '100%';
        setTimeout(function () { if (box && box.parentNode) box.parentNode.removeChild(box); }, 260);
        if (box) box.className = 'hide';
      }
    } catch (e) {}
  }, 90);
})();
</script>
